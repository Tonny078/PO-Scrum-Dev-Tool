<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Dashboard — Scrum Master Workspace by Tonny Sluijs</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#f1f5f9;
  --border:#e8edf5;
  --border-strong:#d8e0ec;
  --text:#1e293b;
  --text-2:#64748b;
  --text-3:#94a3b8;
  --primary:#635bff;
  --primary-hover:#5248f5;
  --primary-weak:#f0efff;
  --primary-text:#635bff;
  --on-primary:#ffffff;

  --green:#10b981;  --green-weak:#e7f8f1;
  --blue:#3b82f6;   --blue-weak:#e8f1fe;
  --amber:#f59e0b;  --amber-weak:#fef4e2;
  --orange:#ea580c; --orange-weak:#fdefe6;
  --red:#ef4444;    --red-weak:#fdecec;
  --purple:#7c3aed; --purple-weak:#f2ebfe;
  --slate:#94a3b8;  --slate-weak:#f1f5f9;

  --sidebar-bg:#111827;
  --sidebar-text:#94a3b8;
  --sidebar-hover:#1c2637;
  --sidebar-title:#ffffff;
  --sidebar-border:#1f2937;

  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.03);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.06);

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --sb-w:256px;

  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: light; }

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0a0e19;
    --surface:#131a2a;
    --surface-2:#0f1523;
    --surface-3:#1a2235;
    --border:#212c44;
    --border-strong:#2c3a56;
    --text:#e8edf7;
    --text-2:#9aa8c2;
    --text-3:#6b7a96;
    --primary:#7d76ff;
    --primary-hover:#8f89ff;
    --primary-weak:#221f4a;
    --primary-text:#a7a1ff;
    --green-weak:#0e2a22;  --blue-weak:#122239;  --amber-weak:#2c2210;
    --orange-weak:#2e1a0f; --red-weak:#301518;   --purple-weak:#241a3d;
    --slate-weak:#1a2235;
    --sidebar-bg:#080c16;
    --sidebar-hover:#161f31;
    --sidebar-border:#1a2334;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  }
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0e19;
  --surface:#131a2a;
  --surface-2:#0f1523;
  --surface-3:#1a2235;
  --border:#212c44;
  --border-strong:#2c3a56;
  --text:#e8edf7;
  --text-2:#9aa8c2;
  --text-3:#6b7a96;
  --primary:#7d76ff;
  --primary-hover:#8f89ff;
  --primary-weak:#221f4a;
  --primary-text:#a7a1ff;
  --green-weak:#0e2a22;  --blue-weak:#122239;  --amber-weak:#2c2210;
  --orange-weak:#2e1a0f; --red-weak:#301518;   --purple-weak:#241a3d;
  --slate-weak:#1a2235;
  --sidebar-bg:#080c16;
  --sidebar-hover:#161f31;
  --sidebar-border:#1a2334;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4,h5,p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app{display:flex;height:100vh;overflow:hidden}

.sidebar{
  width:var(--sb-w);flex:0 0 var(--sb-w);
  background:var(--sidebar-bg);
  border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:16px;gap:16px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 2px}
.brand-name{font-weight:800;color:var(--sidebar-title);font-size:15px;line-height:1.2}
.brand-sub{font-size:10px;color:#64748b;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:var(--r);
  color:var(--sidebar-text);font-weight:500;font-size:13.5px;
  transition:background .14s,color .14s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(79,70,229,.28);
}
.nav-item .count{
  margin-left:auto;font-size:10px;font-weight:700;
  background:rgba(148,163,184,.16);color:var(--sidebar-text);
  padding:1px 7px;border-radius:99px;
}
.nav-item.active .count{background:rgba(255,255,255,.22);color:#fff}

.focus-card{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:linear-gradient(180deg,#1e1a53,#0f0e34);
  border:1px solid #262b4d;padding:16px;text-align:center;
}
.focus-card h4{color:#fff;font-size:13px;font-weight:700}
.focus-card p{font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.5}
.focus-stat{display:flex;justify-content:space-between;font-size:11px;color:#c7d2fe;margin-top:12px;font-weight:600}
.focus-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.focus-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818cf8,#34d399)}
.stars{position:absolute;inset:0;opacity:.25;pointer-events:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  height:64px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:24px;min-width:0}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:11px;color:var(--text-3);font-weight:500}
.vdiv{width:1px;height:32px;background:var(--border);flex-shrink:0}
.greet{font-size:13.5px;font-weight:600;color:var(--text)}
.greet-sub{font-size:12px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:10px}

.icon-btn{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:99px;
  color:var(--text-2);background:var(--surface);
  transition:background .14s,color .14s,border-color .14s;position:relative;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sq{border-radius:var(--r-sm);width:34px;height:34px}
.icon-btn .dot{
  position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:99px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface);
}

.searchbox{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--border);border-radius:99px;
  padding:0 14px;height:36px;background:var(--surface-2);
  transition:border-color .14s,box-shadow .14s;
}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.searchbox input{border:none;background:none;outline:none;width:170px;font-size:13px}
.searchbox input::placeholder{color:var(--text-3)}

.user-chip{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--border);height:36px}

.content{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:20px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-title{display:flex;align-items:center;gap:12px;min-width:0}
.card-title h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-title .sub{font-size:11.5px;color:var(--text-3);font-weight:500}
.tile-icon{
  width:36px;height:36px;border-radius:var(--r);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-weak);color:var(--primary-text);
}
.tile-icon.sm{width:28px;height:28px;border-radius:var(--r-sm)}
.side-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.side-head h3{font-size:14px;font-weight:700}
.side-head .ic{color:var(--primary-text)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--r);
  font-size:12.5px;font-weight:600;white-space:nowrap;
  border:1px solid transparent;transition:background .14s,border-color .14s,color .14s,transform .08s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(99,91,255,.22)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-soft{background:var(--primary-weak);color:var(--primary-text)}
.btn-soft:hover{filter:brightness(.97)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}
.btn-danger-soft{background:var(--red-weak);color:var(--red)}
.btn-danger-soft:hover{filter:brightness(.97)}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45;pointer-events:none}

.link{color:var(--primary-text);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline}

select.sel,input.inp,textarea.inp{
  border:1px solid var(--border);background:var(--surface);
  border-radius:var(--r);padding:8px 11px;font-size:12.5px;
  color:var(--text);outline:none;transition:border-color .14s,box-shadow .14s;width:100%;
}
select.sel{padding-right:28px;font-weight:600;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.inp:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.inp::placeholder{color:var(--text-3)}
textarea.inp{resize:vertical;min-height:82px;line-height:1.55}
select.sel-auto{width:auto;max-width:230px}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
  white-space:nowrap;line-height:1.4;
}
.b-high{background:var(--red-weak);color:var(--red)}
.b-medium{background:var(--orange-weak);color:var(--orange)}
.b-low{background:var(--green-weak);color:var(--green)}
.b-critical{background:var(--red);color:#fff}
.b-approved{background:var(--green-weak);color:var(--green)}
.b-pending{background:var(--amber-weak);color:var(--amber)}
.b-rejected{background:var(--red-weak);color:var(--red)}
.b-superseded{background:var(--slate-weak);color:var(--text-2)}
.b-proposed{background:var(--blue-weak);color:var(--blue)}
.b-planned{background:var(--blue-weak);color:var(--blue)}
.b-active{background:var(--purple-weak);color:var(--purple)}
.b-done{background:var(--green-weak);color:var(--green)}
.b-atrisk{background:var(--red-weak);color:var(--red)}
.b-neutral{background:var(--slate-weak);color:var(--text-2)}
.b-overdue{background:var(--red);color:#fff}

.tag{
  display:inline-flex;font-size:10px;font-weight:600;padding:2px 7px;
  border-radius:5px;background:var(--surface-3);color:var(--text-2);
}

.avatar{
  width:22px;height:22px;border-radius:99px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#fff;letter-spacing:.02em;
  text-transform:uppercase;user-select:none;
}
.avatar.md{width:32px;height:32px;font-size:11.5px}
.avatar.lg{width:44px;height:44px;font-size:15px}

.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:11px}
.mini{font-size:10px}
.bold{font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spacer{flex:1}
.hidden{display:none !important}

.dot-sm{width:9px;height:9px;border-radius:99px;flex-shrink:0}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:44px 20px;text-align:center;color:var(--text-3);
}
.empty .ic{
  width:52px;height:52px;border-radius:var(--r-lg);
  background:var(--surface-3);color:var(--text-3);
  display:flex;align-items:center;justify-content:center;
}
.empty h4{font-size:14px;font-weight:700;color:var(--text-2)}
.empty p{font-size:12.5px;max-width:340px;line-height:1.6}
.empty.sm{padding:26px 14px}
.empty.sm .ic{width:40px;height:40px}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:800;letter-spacing:-.025em}
.page-head p{font-size:13px;color:var(--text-2);margin-top:3px}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============================================================
   OVERVIEW GRID
   ============================================================ */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.col-left{display:flex;flex-direction:column;gap:20px;min-width:0}
.col-right{display:flex;flex-direction:column;gap:20px;min-width:0}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.stat-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text-2)}
.stat-row .v{font-weight:800;font-size:14px}

.donut-wrap{display:flex;justify-content:center;padding:6px 0 14px}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .mid b{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.donut .mid span{font-size:9.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%}
.progress span{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .3s}
.progress.thick{height:12px}

/* ============================================================
   KANBAN
   ============================================================ */
.kanban{
  display:grid;
  grid-template-columns:repeat(var(--cols,5),minmax(158px,1fr));
  gap:12px;overflow-x:auto;padding-bottom:6px;align-items:stretch;
}
.kcol{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:10px;
  display:flex;flex-direction:column;min-height:230px;
  transition:background .14s,border-color .14s;
}
.kcol[data-accent="blue"]{background:color-mix(in srgb,var(--blue) 7%,var(--surface));border-color:color-mix(in srgb,var(--blue) 16%,var(--border))}
.kcol[data-accent="orange"]{background:color-mix(in srgb,var(--orange) 7%,var(--surface));border-color:color-mix(in srgb,var(--orange) 16%,var(--border))}
.kcol[data-accent="purple"]{background:color-mix(in srgb,var(--purple) 7%,var(--surface));border-color:color-mix(in srgb,var(--purple) 16%,var(--border))}
.kcol[data-accent="green"]{background:color-mix(in srgb,var(--green) 7%,var(--surface));border-color:color-mix(in srgb,var(--green) 16%,var(--border))}
.kcol[data-accent="red"]{background:color-mix(in srgb,var(--red) 7%,var(--surface));border-color:color-mix(in srgb,var(--red) 16%,var(--border))}
.kcol.drop-on{border-color:var(--primary);background:var(--primary-weak);border-style:dashed}
.kcol-head{display:flex;align-items:center;gap:6px;padding:2px 4px 8px}
.kcol-head .name{font-size:12px;font-weight:700;letter-spacing:.01em}
.kcol-head .n{
  font-size:10px;font-weight:700;min-width:20px;height:20px;padding:0 6px;
  border-radius:99px;background:var(--surface-3);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
}
.kcol[data-accent="blue"] .name{color:var(--blue)}   .kcol[data-accent="blue"] .n{background:var(--blue-weak);color:var(--blue)}
.kcol[data-accent="orange"] .name{color:var(--orange)}.kcol[data-accent="orange"] .n{background:var(--orange-weak);color:var(--orange)}
.kcol[data-accent="purple"] .name{color:var(--purple)}.kcol[data-accent="purple"] .n{background:var(--purple-weak);color:var(--purple)}
.kcol[data-accent="green"] .name{color:var(--green)}  .kcol[data-accent="green"] .n{background:var(--green-weak);color:var(--green)}
.kcol[data-accent="red"] .name{color:var(--red)}      .kcol[data-accent="red"] .n{background:var(--red-weak);color:var(--red)}
.kcol-head .over{color:var(--red)}
.kbody{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;overflow-x:hidden;max-height:52vh;padding:1px}
.kcol.compact .kbody{max-height:300px}

.task{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 11px;
  box-shadow:var(--shadow-sm);cursor:grab;
  display:flex;flex-direction:column;gap:8px;
  transition:box-shadow .14s,border-color .14s,transform .08s;
}
.task:hover{box-shadow:var(--shadow);border-color:var(--border-strong)}
.task.dragging{opacity:.4}
.task .t{font-size:12px;font-weight:600;line-height:1.45}
.task .t.done{text-decoration:line-through;color:var(--text-3)}
.task.blocked{border-left:3px solid var(--red)}
.task .pts{
  font-size:10px;font-weight:800;flex-shrink:0;
  background:var(--surface-3);color:var(--text-2);
  border-radius:5px;padding:1px 6px;line-height:1.6;
}
.blocked-row{
  display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  color:var(--red);background:var(--red-weak);border-radius:var(--r-sm);padding:5px 7px;
}
.blocked-row .grow{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blocked-row button{color:var(--red);flex-shrink:0;opacity:.75}
.blocked-row button:hover{opacity:1}
.task-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.task-meta{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-3);font-weight:600;white-space:nowrap}
.task-meta.late{color:var(--red)}
/* Kept visible so the board is usable on touch, where there is no hover. */
.task-move{display:flex;gap:2px;opacity:.4;transition:opacity .14s}
.task:hover .task-move,.task:focus-within .task-move{opacity:1}
.task-move button{
  width:20px;height:20px;border-radius:5px;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;
}
.task-move button:hover{background:var(--surface-3);color:var(--text)}
.check{
  width:19px;height:19px;border-radius:99px;flex-shrink:0;
  background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.kadd{
  width:100%;padding:7px;margin-top:8px;border-radius:var(--r);
  font-size:11.5px;font-weight:700;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .14s,color .14s;
}
.kadd:hover{background:var(--surface);color:var(--text-2)}

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th{
  text-align:left;padding:10px 12px;font-size:10px;font-weight:800;
  color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;
  background:var(--surface-2);white-space:nowrap;
}
table.tbl th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
table.tbl th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
table.tbl td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
.cell-strong{font-weight:600;line-height:1.5}
.cell-w{max-width:230px}
.act{display:flex;gap:4px;justify-content:flex-end}
.act button{width:28px;height:28px;border-radius:var(--r-sm);color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:background .14s,color .14s}
.act button:hover{background:var(--surface-3);color:var(--text)}
.act button.del:hover{background:var(--red-weak);color:var(--red)}

/* ============================================================
   LIST ITEMS
   ============================================================ */
.item{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 14px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);
  transition:border-color .14s,box-shadow .14s;
}
.item:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.item.drag-target{border-color:var(--primary);border-style:dashed}
.item.dragging{opacity:.4}
.item h4{font-size:13px;font-weight:600;line-height:1.45}
.item p{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.55}
.grip{color:var(--text-3);cursor:grab;padding-top:2px}

.sticky-note{
  border-radius:var(--r);padding:13px 14px;border:1px solid transparent;
  border-left-width:4px;display:flex;flex-direction:column;gap:8px;min-height:96px;
}
.sn-yellow{background:color-mix(in srgb,#fde68a 26%,var(--surface));border-left-color:#f59e0b}
.sn-blue{background:color-mix(in srgb,#93c5fd 24%,var(--surface));border-left-color:#3b82f6}
.sn-green{background:color-mix(in srgb,#86efac 24%,var(--surface));border-left-color:#10b981}
.sn-pink{background:color-mix(in srgb,#f9a8d4 24%,var(--surface));border-left-color:#ec4899}
.sn-purple{background:color-mix(in srgb,#c4b5fd 24%,var(--surface));border-left-color:#8b5cf6}
.sticky-note .txt{font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;flex:1}

.kr{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 0}
.kr input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.kr.done span{text-decoration:line-through;color:var(--text-3)}

.retro-col{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--surface-2)}
.retro-col h5{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.retro-line{
  display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.55;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 10px;margin-bottom:6px;
}
.retro-line button{color:var(--text-3);flex-shrink:0}
.retro-line button:hover{color:var(--red)}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;
  border-radius:99px;background:var(--surface);border:2px solid var(--primary);
}
.tl-item .when{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tl-item .what{font-size:12.5px;margin-top:2px;line-height:1.55}

/* ============================================================
   SCRUM MASTER COMPONENTS
   ============================================================ */
/* --- sprint header strip --- */
.sprint-strip{
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;
  border-radius:var(--r-lg);border:1px solid var(--border);
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 9%,var(--surface)),var(--surface));
  padding:20px;box-shadow:var(--shadow-sm);
}
.sprint-strip .goal{
  font-size:13.5px;line-height:1.6;font-weight:600;
  border-left:3px solid var(--primary);padding-left:12px;margin-top:10px;
}
.sprint-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px}
.sprint-meta .m{min-width:76px}
.sprint-meta .m b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sprint-meta .m span{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.daypips{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.daypips i{width:14px;height:6px;border-radius:99px;background:var(--surface-3);display:block}
.daypips i.past{background:var(--primary)}
.daypips i.today{background:var(--amber);box-shadow:0 0 0 2px var(--amber-weak)}

/* --- charts --- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--text-3);font-size:8px;font-weight:700}
.chart .ideal{stroke:var(--text-3);stroke-width:1.6;stroke-dasharray:4 4;fill:none}
.chart .actual{stroke:var(--primary);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--primary);opacity:.09}
.chart .pt{fill:var(--primary)}
.chart .bar{fill:var(--primary);rx:2}
.chart .bar.dim{fill:var(--slate)}
.chart .avgline{stroke:var(--amber);stroke-width:1.6;stroke-dasharray:5 4}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-2);font-weight:600}
.chart-legend i{width:16px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}

/* --- stat tiles --- */
.stat-tile{
  border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface-2);padding:13px 14px;
}
.stat-tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.stat-tile span{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.stat-tile p{font-size:11px;color:var(--text-2);margin-top:5px;line-height:1.5}

/* --- impediments --- */
.item.imp{border-left:3px solid var(--slate)}
.item.imp[data-sev="high"]{border-left-color:var(--orange)}
.item.imp[data-sev="critical"]{border-left-color:var(--red)}
.item.imp[data-sev="medium"]{border-left-color:var(--amber)}
.item.imp.resolved{opacity:.62}
.age{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--slate-weak);color:var(--text-2);white-space:nowrap}
.age.warn{background:var(--amber-weak);color:var(--amber)}
.age.bad{background:var(--red);color:#fff}

/* --- ceremonies --- */
.cer-card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}
.cer-card.today{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));box-shadow:0 0 0 3px var(--primary-weak)}
.cer-card h4{font-size:14px;font-weight:700}
.timebox{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
  padding:3px 8px;border-radius:6px;background:var(--primary-weak);color:var(--primary-text);
}
.agenda{display:flex;flex-direction:column;gap:2px}
.agenda label{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.55;padding:4px 0;cursor:pointer}
.agenda input{width:15px;height:15px;accent-color:var(--primary);flex-shrink:0;margin-top:1px}
.agenda label.done span{text-decoration:line-through;color:var(--text-3)}

/* --- timebox timer --- */
.timer{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;
  border:1px solid var(--border);border-radius:99px;background:var(--surface-2);
}
.timer .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px;letter-spacing:-.01em;min-width:46px}
.timer .lbl{font-size:10.5px;font-weight:700;color:var(--text-3);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.timer button:hover{background:var(--surface-3);color:var(--text)}
.timer.over{border-color:var(--red);background:var(--red-weak)}
.timer.over .t{color:var(--red)}
.timer.paused .t{color:var(--text-3)}

/* --- team & health --- */
.member{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.member.away{background:var(--surface-2)}
.cap-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.cap-bar span{display:block;height:100%;border-radius:99px;background:var(--blue)}
.mood{display:flex;gap:3px;flex-wrap:wrap}
.mood i{width:15px;height:15px;border-radius:4px;display:block;background:var(--surface-3)}
.mood i[data-s="1"]{background:var(--red)}
.mood i[data-s="2"]{background:var(--orange)}
.mood i[data-s="3"]{background:var(--amber)}
.mood i[data-s="4"]{background:color-mix(in srgb,var(--green) 70%,var(--amber))}
.mood i[data-s="5"]{background:var(--green)}

/* --- reference / playbook --- */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ref{border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);padding:12px 13px}
.ref h5{font-size:12.5px;font-weight:700;margin-bottom:4px}
.ref p{font-size:11.5px;color:var(--text-2);line-height:1.55}
.ref .k{font-size:10px;font-weight:800;color:var(--primary-text);text-transform:uppercase;letter-spacing:.05em}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist div{
  display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.55;
  padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);
}
.checklist div span.n{
  font-size:10px;font-weight:800;color:var(--primary-text);background:var(--primary-weak);
  border-radius:5px;padding:1px 6px;flex-shrink:0;margin-top:1px;
}

/* --- keyboard shortcuts --- */
.keys{display:flex;flex-direction:column;gap:8px}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12.5px}
kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;
  border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:6px;
  padding:2px 8px;background:var(--surface-2);color:var(--text-2);
}

/* ============================================================
   FOOTER
   ============================================================ */
.app-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:28px;padding:16px 4px 4px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text-3);
}
.app-foot b{font-weight:700;color:var(--text-2)}
.app-foot .credit{font-weight:600}

/* ============================================================
   BANNER
   ============================================================ */
.banner{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:linear-gradient(135deg,#635bff,#1e3a8a);
  padding:20px;text-align:center;color:#fff;
  box-shadow:0 10px 26px rgba(30,58,138,.22);
}
.banner h4{font-size:15px;font-weight:700}
.banner p{font-size:12px;color:#dbeafe;margin-top:7px;line-height:1.55}
.banner .star{position:absolute;color:#fde047;opacity:.85}

/* ============================================================
   MODAL / OVERLAY
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade .16s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);box-shadow:var(--shadow-lg);
  width:100%;max-width:560px;max-height:88vh;
  display:flex;flex-direction:column;animation:pop .18s ease-out;
}
.modal.wide{max-width:760px}
.modal.narrow{max-width:430px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.modal-head p{font-size:12.5px;color:var(--text-2);margin-top:3px}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--border)}
.close-x{width:30px;height:30px;border-radius:var(--r-sm);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.close-x:hover{background:var(--surface-3);color:var(--text)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:700;color:var(--text-2)}
.field .hint{font-size:11px;color:var(--text-3);line-height:1.5}
.field .req{color:var(--red)}

.rep-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.rep-row .inp{flex:1}
.rep-check{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin:0}
.rep-check-cell{flex:0 0 54px;display:flex;justify-content:center;align-items:center}
.rep-head{margin-bottom:5px}
.rep-h{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);flex:1;line-height:1;
}
.rep-h-check{flex:0 0 54px;text-align:center}
.rep-del{width:30px;height:30px;flex-shrink:0;border-radius:var(--r-sm);color:var(--text-3);display:flex;align-items:center;justify-content:center}
.rep-del:hover{background:var(--red-weak);color:var(--red)}
.rep-row.excluded .inp,.rep-row.excluded .sel{opacity:.45}

.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r);padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);transition:background .14s,color .14s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ============================================================
   WIZARD
   ============================================================ */
.wizard{max-width:620px;width:100%}
.wiz-hero{text-align:center;padding:30px 26px 6px}
.wiz-hero h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:16px}
.wiz-hero p{font-size:13.5px;color:var(--text-2);margin-top:8px;line-height:1.6}
/* The overlay covers the top-bar switch, so the wizard carries its own. */
.wiz-lang{display:flex;justify-content:center;padding:0 26px 22px}
.choice{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:16px;transition:border-color .14s,background .14s,box-shadow .14s;
}
.choice:hover:not(.off){border-color:var(--primary);background:var(--primary-weak);box-shadow:var(--shadow)}
.choice.off{opacity:.55;cursor:not-allowed}
.choice .ic{
  width:42px;height:42px;border-radius:var(--r);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-weak);color:var(--primary-text);
}
.choice h4{font-size:14px;font-weight:700}
.choice p{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.55}
.notice{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--amber-weak);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent);
  border-radius:var(--r);padding:11px 13px;font-size:12px;line-height:1.55;color:var(--text);
}
.notice.info{background:var(--blue-weak);border-color:color-mix(in srgb,var(--blue) 26%,transparent)}
.notice.danger{background:var(--red-weak);border-color:color-mix(in srgb,var(--red) 26%,transparent)}
.notice code{background:rgba(127,127,127,.16);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* ============================================================
   DROPDOWN PANEL
   ============================================================ */
.panel{
  position:absolute;top:52px;right:0;z-index:50;width:330px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  animation:pop .14s ease-out;overflow:hidden;
}
.panel-head{padding:13px 15px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.panel-body{max-height:360px;overflow-y:auto;padding:6px}
.panel-row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.5}
.panel-row:hover{background:var(--surface-2)}
.panel-row .when{font-size:10.5px;color:var(--text-3);white-space:nowrap;font-weight:600}
.topbar-right{position:relative}

/* ============================================================
   TOAST
   ============================================================ */
.toasts{position:fixed;bottom:22px;right:22px;z-index:90;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--primary);
  border-radius:var(--r);padding:11px 15px;box-shadow:var(--shadow-lg);
  font-size:12.5px;font-weight:600;animation:pop .18s ease-out;max-width:340px;
}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}

/* ============================================================
   SETTINGS
   ============================================================ */
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:15px 0;border-bottom:1px solid var(--border);
}
.set-row:last-child{border-bottom:none;padding-bottom:0}
.set-row:first-child{padding-top:0}
.set-row .lbl{font-size:13px;font-weight:600}
.set-row .desc{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.55;max-width:440px}
.danger-zone{border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:var(--r-lg);padding:20px;background:var(--red-weak)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1240px){
  .grid-main{grid-template-columns:minmax(0,1fr)}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sprint-strip{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1080px){
  :root{--sb-w:74px}
  .sidebar{padding:14px 10px}
  .nav-item{justify-content:center;padding:11px 0}
  .nav-item span.lbl,.nav-item .count,.brand div,.focus-card{display:none}
  .brand{justify-content:center}
  .searchbox input{width:110px}
}
@media (max-width:860px){
  .content{padding:16px}
  .grid-3,.grid-2,.grid-4{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:1fr}

<script>
/* ============================================================================
   SM DASHBOARD — single-file, dependency-free Scrum Master workspace.
   Sections below: utils › icons › store › state › render › views › actions.
   Storage keys are prefixed sm. so this never collides with the PO tool.
   ========================================================================= */
"use strict";
/* ============================================================================
   0. LANGUAGE  (display only — never touches stored data)
   ---------------------------------------------------------------------------
   The catalog is keyed by the English source string, so anything not yet
   translated renders in English instead of leaking a key. The chosen language
   lives in its own localStorage entry, deliberately outside the workspace:
   settings.json, the folder JSON and the export bundle are unchanged by
   switching language.

   Named _t because `t` is already the loop variable for "task" throughout.
   ========================================================================= */
const LANG_KEY = "sm.lang";
let LANG = "en";
try { LANG = localStorage.getItem(LANG_KEY) === "nl" ? "nl" : "en"; } catch (e) { LANG = "en"; }

/* Add ?i18n=audit to the URL to bracket every translated string. Anything on
   screen WITHOUT brackets is a literal that still needs wrapping. */
const I18N_AUDIT = /[?&]i18n=audit/.test(location.search);
const _missing = new Set();

/**
 * Translate one interface string. The English text is the key.
 * Returns plain text — wrap in esc() exactly where the English literal was.
 *   _t("Add task")
 *   _t("Low", "impact")   // tries "impact|Low", then "Low"
 */
function _t(s, ctx) {
  if (s === null || s === undefined || typeof s !== "string") return s;
  let out = s;
  if (LANG === "nl") {
    const ck = ctx ? ctx + "|" + s : null;
    if (ck && Object.prototype.hasOwnProperty.call(NL, ck)) out = NL[ck];
    else if (Object.prototype.hasOwnProperty.call(NL, s)) out = NL[s];
    else { if (s.trim()) _missing.add(ck || s); if (I18N_AUDIT) out = "\u00ab" + s + "\u00bb"; }
  } else if (I18N_AUDIT && s.trim()) {
    out = "[" + s + "]";
  }
  return out;
}

/** Translate with named placeholders, so Dutch may reorder them. */
function _tp(s, vars) {
  return String(_t(s)).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
}

/**
 * Display label for starter content - the text seed*() and default*() wrote
 * into the workspace on first run (checklist steps, board columns, ceremony
 * agendas, the Definition of Done).
 *
 * That text is DATA: it stays English in storage, in the folder JSON and in
 * the export, so switching language never rewrites a saved record. Only what
 * is on screen changes.
 *
 * Looked up ONLY under a "seed|" key, with no fallback to the plain key, so a
 * note the user titles "Settings" can never come back as "Instellingen".
 * Anything the user typed themselves passes through untouched.
 */
function _sd(s) {
  if (LANG !== "nl" || typeof s !== "string" || !s) return s;
  const k = "seed|" + s;
  return Object.prototype.hasOwnProperty.call(NL, k) ? NL[k] : s;
}

/** Console helper: which wrapped strings still have no Dutch. */
window.__i18nMissing = () => Array.from(_missing).sort();

/* Dates are display, never storage: the stored value stays an ISO string and
   only the rendering follows the chosen language. */
function dateLocale() { return LANG === "nl" ? "nl-NL" : "en-GB"; }

/* Display labels for stored enum values. The VALUE stays an English identifier
   in the data and in CSS class names; only what the user reads is translated. */
const VALUE_LABELS = {
  priority:  { low: "Low", medium: "Medium", high: "High", critical: "Critical" },
  impact:    { low: "Low", medium: "Medium", high: "High", critical: "Critical" },
  severity:  { low: "Low", medium: "Medium", high: "High", critical: "Critical" },
  status:    { proposed: "Proposed", pending: "Pending", approved: "Approved", rejected: "Rejected", superseded: "Superseded" },
};

/** Display label for a stored enum value. `domain` doubles as the _t context. */
function vlabel(domain, value) {
  const v = String(value === null || value === undefined ? "" : value);
  if (!v) return "";
  const en = (VALUE_LABELS[domain] || {})[v] || (v[0].toUpperCase() + v.slice(1));
  return _t(en, domain);
}

/** Apply the language to the parts of the shell that render() never repaints. */
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = "SM Dashboard — " + _t("Scrum Master Workspace") + " " + _t("by Tonny Sluijs");
  const set = (sel, text) => { const el = $(sel); if (el) el.textContent = text; };
  set(".brandinfo .sub", _t("Scrum Master Workspace"));
  set(".brand-sub", _t("Workspace by Tonny Sluijs."));
  /* The wizard path never reaches render(), so the static greeting would stay
     English until onboarding finished. renderTopbar() replaces both with the
     personalised greeting once state is loaded. */
  set("#greet", _t("Welcome"));
  set("#greetSub", _t("Let's build something amazing today."));
  const search = $("#search");
  if (search) search.placeholder = _t("Search everything…");
  const bell = $("#bellBtn"); if (bell) bell.title = _t("Alerts");
  const act = $('[data-panel="activity"]'); if (act) act.title = _t("Recent activity");
  const chip = $(".user-chip"); if (chip) chip.title = _t("Open settings");
  $$("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
}

/* ============================================================================
   1. UTILITIES
   ========================================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/** Escape user content before it ever touches innerHTML. */
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid(prefix) {
  return (prefix || "id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
const nowISO = () => new Date().toISOString();
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(dateLocale(), { month: "short", day: "numeric", year: "numeric" });
}
function fmtShort(iso) {
  if (!iso) return "";
  const d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(dateLocale(), { month: "short", day: "numeric" });
}
function relTime(iso) {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.round(diff / 60000);
  if (m < 1) return _t("just now");
  if (m < 60) return _tp("{n}m ago", { n: m });
  const h = Math.round(m / 60);
  if (h < 24) return _tp("{n}h ago", { n: h });
  const d = Math.round(h / 24);
  if (d < 31) return _tp("{n}d ago", { n: d });
  return fmtDate(iso);
}
/** Days until a YYYY-MM-DD date. Negative = overdue. */
function daysUntil(iso) {
  if (!iso) return null;
  const a = new Date(todayISO() + "T00:00:00");
  const b = new Date(iso.slice(0, 10) + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function quarterOf(iso) {
  if (!iso) return "No date";
  const d = new Date(iso.slice(0, 10) + "T00:00:00");
  if (isNaN(d)) return "No date";
  return "Q" + (Math.floor(d.getMonth() / 3) + 1) + " " + d.getFullYear();
}
function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2);
  return parts[0][0] + parts[parts.length - 1][0];
}
function hueOf(str) {
  let h = 0;
  const s = String(str || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}
/** Initials avatar — pure CSS, no images anywhere in this app. */
function avatar(name, size) {
  if (!name) return "";
  const h = hueOf(name);
  const bg = "linear-gradient(135deg,hsl(" + h + ",62%,54%),hsl(" + ((h + 38) % 360) + ",62%,44%))";
  return '<span class="avatar ' + (size || "") + '" style="background:' + bg + '" title="' + esc(name) + '">' + esc(initials(name)) + "</span>";
}
function pluralise(n, one, many) {
  return n + " " + (n === 1 ? _t(one) : (many ? _t(many) : _t(one + "s")));
}
function sortBy(arr, fn, dir) {
  return arr.slice().sort((a, b) => {
    const x = fn(a), y = fn(b);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * (dir === "desc" ? -1 : 1);
  });
}
/** Clipboard for file:// pages, where navigator.clipboard is often blocked. */
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;left:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function download(filename, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** Inline SVG icon. */
function ic(name, size, stroke) {
  const d = PATHS[name];
  if (!d) return "";
  const paths = (Array.isArray(d) ? d : [d]).map(p => '<path d="' + p + '"/>').join("");
  const s = size || 16;

    (stroke || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
}

const DOMAINS = [
  "settings", "boards", "sprints", "impediments", "ceremonies", "standups", "team", "health",
  "decisions", "roadmap", "refinement", "notes", "documents", "agreements", "retrospectives", "risks", "activity",
];
const CONFIG_KEY = "sm.config";
const LS_PREFIX = "sm.";
const SCHEMA_VERSION = 1;

function defaultDoc(key) {
  if (key === "settings") {
    return {
      version: SCHEMA_VERSION,
      workspaceName: "My Team",
      teamName: "",
      profile: { name: "Scrum Master", role: "Scrum Master" },

}

/* --- tiny IndexedDB kv store, used only to remember the folder handle --- */
function idbOpen() {
  return new Promise((res, rej) => {
    let req;
    try { req = indexedDB.open("sm-dashboard", 1); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
    // Another tab holding an old version would otherwise leave this pending forever.
    req.onblocked = () => rej(new Error("IndexedDB is blocked by another tab"));
    setTimeout(() => rej(new Error("IndexedDB timed out")), 4000);
  });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => { db.close(); res(); };
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readonly");
    const q = tx.objectStore("kv").get(k);
    q.onsuccess = () => { db.close(); res(q.result); };
    q.onerror = () => rej(q.error);
  });
}
async function idbDel(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(k);
    tx.oncomplete = () => { db.close(); res(); };
    tx.onerror = () => rej(tx.error);
  });
}

const Store = {
  mode: "local",     // 'local' | 'folder'
  dir: null,         // FileSystemDirectoryHandle
  folderName: "",

  folderSupported() {
    return typeof window.showDirectoryPicker === "function";
  },

  async pickFolder() {
    const dir = await window.showDirectoryPicker({ id: "sm-dashboard", mode: "readwrite", startIn: "documents" });
    const perm = await this.grant(dir);
    if (!perm) throw new Error("Permission to write in that folder was not granted.");
    this.dir = dir;
    this.folderName = dir.name;
    this.mode = "folder";
    // Remembering the handle is a convenience — never let it hold up startup.
    idbSet("dir", dir).catch(() => {
      toast("This browser will not remember the folder — you will be asked to pick it again next time.", "warn", 6000);
    });
    return dir;
  },

  async grant(dir) {
    if (!dir.queryPermission) return true;
    if ((await dir.queryPermission({ mode: "readwrite" })) === "granted") return true;
    return (await dir.requestPermission({ mode: "readwrite" })) === "granted";
  },

  /** Read one domain. Returns null when nothing is stored yet. */
  async read(key) {
    if (this.mode === "folder") {
      try {
        const fh = await this.dir.getFileHandle(key + ".json");
        const text = await (await fh.getFile()).text();
        return text.trim() ? JSON.parse(text) : null;
      } catch (e) {
        if (e && (e.name === "NotFoundError" || e.name === "NotAllowedError")) return null;
        if (e instanceof SyntaxError) {
          toast(_tp("{file}.json is not valid JSON — it was skipped, not overwritten.", { file: key }), "err", 8000);
          return null;
        }
        return null;
      }
    }
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  },

  /** Write one domain. Overwrites that single file only. */
  async write(key, obj) {
    obj.updatedAt = nowISO();
    obj.version = obj.version || SCHEMA_VERSION;
    const text = JSON.stringify(obj, null, 2);
    if (this.mode === "folder") {
      const fh = await this.dir.getFileHandle(key + ".json", { create: true });
      const w = await fh.createWritable();
      await w.write(text);
      await w.close();
      return;
    }
    localStorage.setItem(LS_PREFIX + key, text);
  },

  async wipe() {
    if (this.mode === "folder" && this.dir) {
      for (const key of DOMAINS) {
        try { await this.dir.removeEntry(key + ".json"); } catch (e) { /* not there */ }
      }
    }
    DOMAINS.forEach(k => localStorage.removeItem(LS_PREFIX + k));
  },

  location() {
    if (this.mode === "folder") return this.folderName ? _tp("Folder: {name}", { name: this.folderName }) : _t("Folder");
    return _t("This browser (localStorage)");
  },
};

/* ============================================================================
   4. STATE
   ========================================================================= */
let S = {};                                    // domain -> document
const dirty = new Set();
let saveTimer = null;
let saving = false;

const ui = {
  view: "overview",
  search: "",
  panel: null,
  decisionStatus: "all",
  impedimentStatus: "all",
  timer: null,          // running timebox, never persisted
  ready: false,
};

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
async function flush() {
  if (saving || !dirty.size) return;
  saving = true;
  const keys = Array.from(dirty);
  dirty.clear();
  try {
    for (const k of keys) await Store.write(k, S[k]);
    setSaveState("saved");
  } catch (e) {
    keys.forEach(k => dirty.add(k));
    setSaveState("error");
    toast(_tp("Could not save: {msg}", { msg: _t(e && e.message ? e.message : String(e)) }), "err", 7000);
  } finally {
    saving = false;
    if (dirty.size) scheduleSave();
  }
}
function markDirty(key) {
  dirty.add(key);
  setSaveState("saving");
  scheduleSave();
}
function setSaveState(kind) {
  const el = $("#saveState");
  if (!el) return;
  const map = {
    saving: [ic("save", 13), _t("Saving…"), "var(--text-3)"],
    saved: [ic("checkCircle", 13), _t("Saved"), "var(--green)"],
    error: [ic("alert", 13), _t("Not saved"), "var(--red)"],
  };
  const m = map[kind] || map.saved;
  el.innerHTML = m[0] + "<span>" + m[1] + "</span>";
  el.style.color = m[2];
}

/**
 * The single entry point for every change.
 * Runs the mutation, marks the touched files dirty, logs activity, re-renders.
 */
function mutate(keys, fn, activityText, activityKind) {
  const result = fn();
  (Array.isArray(keys) ? keys : [keys]).forEach(markDirty);
  if (activityText) logActivity(activityText, activityKind);
  // Keeps today's point on the burndown honest without anyone typing it in.
  snapshotBurndown();
  render();
  return result;
}
function logActivity(text, kind) {
  if (!S.activity) return;
  S.activity.items.unshift({ id: uid("act"), at: nowISO(), text: text, kind: kind || "info" });
  if (S.activity.items.length > 250) S.activity.items.length = 250;
  markDirty("activity");
}

async function loadAll() {
  S = {};
  for (const key of DOMAINS) {
    const stored = await Store.read(key);
    const base = defaultDoc(key);
    // Adopt whatever exists on disk; only fill in what is genuinely missing.
    S[key] = stored ? Object.assign(base, stored) : base;
    if (key !== "settings" && !Array.isArray(S[key].items)) S[key].items = [];
  }
  S.settings.profile = Object.assign({ name: "Scrum Master", role: "Scrum Master" }, S.settings.profile || {});
  S.settings.storageMode = Store.mode;
  repairBoards();
  repairSprints();
  applyTheme();
}

/**
 * A board must have exactly one finished column. Older workspaces could end up
 * with several (which struck tasks through in the wrong columns and pushed the
 * progress bar to 100%) or none (progress stuck at 0%). Fix both quietly.
 */
function repairBoards() {
  const fixed = [];
  (S.boards.items || []).forEach(board => {
    if (!board.columns || !board.columns.length) return;
    const flagged = board.columns.filter(c => c.isDone);
    if (flagged.length === 1) return;
    const keep = flagged.length ? flagged[flagged.length - 1] : board.columns[board.columns.length - 1];
    board.columns.forEach(c => { c.isDone = c.id === keep.id; });
    fixed.push(board.name + " → " + keep.name);
  });
  if (!fixed.length) return;
  markDirty("boards");
  setTimeout(() => {
    toast(_tp("Finished column corrected: {cols}.", { cols: fixed.join(", ") }), "warn", 7000);
  }, 700);
}

/**
 * Exactly one Sprint may be active, and settings.activeSprintId must point at
 * it. An interrupted close, or an imported backup, can break either half.
 */
function repairSprints() {
  const items = (S.sprints && S.sprints.items) || [];
  const active = items.filter(s => s.status === "active");
  if (active.length > 1) {
    // Keep the one that started last; the rest were left behind by an old close.
    const keep = sortBy(active, s => s.start || "", "desc")[0];
    active.forEach(s => { if (s.id !== keep.id) s.status = "closed"; });
    markDirty("sprints");
  }
  const current = items.find(s => s.status === "active");
  const wanted = current ? current.id : null;
  if (S.settings.activeSprintId !== wanted) {
    S.settings.activeSprintId = wanted;
    markDirty("settings");
  }
}

/* ============================================================================
   5. THEME
   ========================================================================= */
function applyTheme() {
  const t = (S.settings && S.settings.theme) || "system";
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* ============================================================================
   6. TOASTS
   ========================================================================= */
function toast(message, kind, ms) {
  const host = $("#toasts");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "toast " + (kind || "ok");
  const iconName = kind === "err" ? "alert" : kind === "warn" ? "info" : "checkCircle";
  el.innerHTML = ic(iconName, 16) + "<span>" + esc(_t(message)) + "</span>";
  host.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .25s,transform .25s";
    el.style.opacity = "0";
    el.style.transform = "translateX(12px)";
    setTimeout(() => el.remove(), 260);
  }, ms || 2600);
}

let modalStack = [];

function closeModal() {
  modalStack.pop();
  const host = $("#modalHost");
  host.innerHTML = "";
  if (modalStack.length) {
    const top = modalStack.pop();
    top();

function closeAllModals() {

/**
 * Generic form modal driven by field descriptors.
 * field: {name,label,type,options,placeholder,hint,required,full,rows,sub,checkKey,addLabel}
 * types: text | textarea | select | date | number | tags | repeater | checkbox | static
 */
function openModal(opts) {
  const fields = opts.fields || [];
  const values = opts.values || {};
  const host = $("#modalHost");
  const body = fields.map(f => fieldHTML(f, values[f.name])).join("");

  host.innerHTML =
    '<div class="overlay" data-overlay>' +
      '<form class="modal ' + (opts.width || "") + '" id="modalForm" autocomplete="off">' +
        '<div class="modal-head">' +
          "<div><h3>" + esc(_t(opts.title)) + "</h3>" +
            (opts.subtitle ? "<p>" + esc(_t(opts.subtitle)) + "</p>" : "") +
          "</div>" +
          '<button type="button" class="close-x" data-action="modal-close" aria-label="' + esc(_t("Close")) + '">' + ic("x", 17) + "</button>" +
        "</div>" +
        '<div class="modal-body">' +
          (opts.topHTML || "") +
          (fields.length ? '<div class="form-grid">' + body + "</div>" : "") +
          (opts.bottomHTML || "") +
        "</div>" +
        '<div class="modal-foot">' +
          (opts.footLeftHTML ? '<div class="spacer" style="text-align:left">' + opts.footLeftHTML + "</div>" : '<div class="spacer"></div>') +
          '<button type="button" class="btn btn-ghost" data-action="modal-close">' + esc(_t(opts.cancelLabel || "Cancel")) + "</button>" +
          (opts.onSave ? '<button type="submit" class="btn btn-primary">' + esc(_t(opts.saveLabel || "Save")) + "</button>" : "") +
        "</div>" +
      "</form>" +
    "</div>";

  const form = $("#modalForm");
  if (opts.onSave) {
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const out = collectForm(form, fields);
      const missing = fields.filter(f => f.required && !String(out[f.name] || "").trim());
      if (missing.length) {
        toast(_tp("{field} is required.", { field: _t(missing[0].label) }), "warn");
        const el = form.querySelector('[name="' + missing[0].name + '"]');
        if (el) el.focus();
        return;
      }
      opts.onSave(out);
    });
  }
  const first = form.querySelector("input:not([type=checkbox]),textarea,select");
  if (first) setTimeout(() => first.focus(), 40);
  if (opts.afterRender) opts.afterRender(form);
}

function fieldHTML(f, value) {
  if (f.type === "static") {
    return '<div class="field ' + (f.full === false ? "" : "full") + '">' +
      (f.label ? "<label>" + esc(_t(f.label)) + "</label>" : "") + (f.html || "") + "</div>";
  }
  const id = "f_" + f.name;
  const cls = "field" + (f.full === false ? "" : (f.half ? "" : " full"));
  const label = '<label for="' + id + '">' + esc(_t(f.label)) + (f.required ? ' <span class="req">*</span>' : "") + "</label>";
  const hint = f.hint ? '<span class="hint">' + esc(_t(f.hint)) + "</span>" : "";
  let input = "";

  switch (f.type) {
    case "textarea":
      input = '<textarea class="inp" id="' + id + '" name="' + f.name + '" rows="' + (f.rows || 3) +
        '" placeholder="' + esc(_t(f.placeholder) || "") + '">' + esc(value || "") + "</textarea>";
      break;
    case "select":
      input = '<select class="sel" id="' + id + '" name="' + f.name + '">' +
        (f.options || []).map(o => {
          const ov = typeof o === "string" ? o : o.value;
          const ol = typeof o === "string" ? o : o.label;
          return '<option value="' + esc(ov) + '"' + (String(value) === String(ov) ? " selected" : "") + ">" + esc(f.raw ? ol : _t(ol)) + "</option>";
        }).join("") + "</select>";
      break;
    case "date":
      input = '<input class="inp" type="date" id="' + id + '" name="' + f.name + '" value="' + esc(value || "") + '">';
      break;
    case "number":
      input = '<input class="inp" type="number" id="' + id + '" name="' + f.name + '" value="' + esc(value === 0 ? 0 : (value || "")) +
        '" min="' + (f.min !== undefined ? f.min : 0) + '" max="' + (f.max !== undefined ? f.max : 100) + '" step="' + (f.step || 1) + '">';
      break;
    case "tags":
      input = '<input class="inp" type="text" id="' + id + '" name="' + f.name + '" value="' +
        esc(Array.isArray(value) ? value.join(", ") : (value || "")) + '" placeholder="' + esc(_t(f.placeholder || "comma, separated")) + '">';
      break;
    case "checkbox":
      return '<div class="' + cls + '"><label class="row" style="cursor:pointer;font-weight:600">' +
        '<input type="checkbox" name="' + f.name + '" ' + (value ? "checked" : "") +
        ' style="width:15px;height:15px;accent-color:var(--primary)"> ' + esc(_t(f.label)) + "</label>" + hint + "</div>";
    case "repeater":
      return '<div class="' + cls + '">' + label + repeaterHTML(f, value) + hint + "</div>";
    default:
      input = '<input class="inp" type="text" id="' + id + '" name="' + f.name + '" value="' + esc(value || "") +
        '" placeholder="' + esc(_t(f.placeholder) || "") + '">';
  }
  return '<div class="' + cls + '">' + label + input + hint + "</div>";
}

function repeaterHTML(f, value) {
  const rows = (Array.isArray(value) && value.length ? value : []).map(v => repeaterRow(f, v)).join("");
  // A header row so no control in the grid is left unlabelled.
  const headers = f.headers
    ? '<div class="rep-row rep-head">' +
      (f.checkKey ? '<span class="rep-h rep-h-check">' + esc(_t(f.headers[0])) + "</span>" : "") +
      f.sub.filter(s => s.type !== "hidden").map((s, i) =>
        '<span class="rep-h"' + (s.width ? ' style="flex:0 0 ' + s.width + '"' : "") + ">" +
        esc(_t(f.headers[(f.checkKey ? 1 : 0) + i] || "")) + "</span>").join("") +
      '<span class="rep-h" style="flex:0 0 30px"></span></div>'
    : "";
  return '<div data-rep="' + f.name + '" data-subs=\'' + esc(JSON.stringify(f.sub)) + "'" +
    ' data-check-key="' + esc(f.checkKey || "") + '" data-check-title="' + esc(f.checkTitle || "Done") + '"' +
    ' data-check-default="' + (f.checkDefault ? "1" : "") + '">' +
    headers +
    '<div class="rep-rows">' + rows + "</div>" +
    '<button type="button" class="btn btn-ghost btn-sm" data-action="rep-add" data-rep="' + f.name + '" style="margin-top:2px">' +
    ic("plus", 13) + esc(_t(f.addLabel || "Add row")) + "</button></div>";
}
function repeaterRow(f, v) {
  v = v || {};
  const inputs = f.sub.map(s => {
    if (s.type === "hidden") {
      // autoId rows get an id straight away so other controls can reference them.
      const val = v[s.name] || (s.autoId ? uid("col") : "");
      return '<input type="hidden" data-sub="' + s.name + '" value="' + esc(val) + '">';
    }
    if (s.type === "select") {
      return '<select class="sel" data-sub="' + s.name + '"' + (s.width ? ' style="flex:0 0 ' + s.width + '"' : "") + ">" +
        (s.options || []).map(o => {
          const ov = typeof o === "string" ? o : o.value;
          const ol = typeof o === "string" ? o : o.label;
          return '<option value="' + esc(ov) + '"' + (String(v[s.name]) === String(ov) ? " selected" : "") + ">" + esc(_t(ol)) + "</option>";
        }).join("") + "</select>";
    }
    const type = s.type === "date" || s.type === "number" ? s.type : "text";
    return '<input class="inp" type="' + type + '" data-sub="' + s.name + '" placeholder="' + esc(_t(s.placeholder || s.name)) +
      '" value="' + esc(v[s.name] || "") + '"' + (s.width ? ' style="flex:0 0 ' + s.width + '"' : "") + ">";
  }).join("");
  const ticked = v[f.checkKey] === undefined ? !!f.checkDefault : !!v[f.checkKey];
  const box = '<input type="checkbox" class="rep-check" data-sub="' + f.checkKey + '" ' + (ticked ? "checked" : "") +
    ' title="' + esc(_t(f.checkTitle || "Done")) + '" aria-label="' + esc(_t(f.checkTitle || "Done")) + '">';

    : f.headers ? '<span class="rep-check-cell">' + box + "</span>" : box;

    '<button type="button" class="rep-del" data-action="rep-del" title="' + esc(_t("Remove row")) + '">' + ic("x", 14) + "</button></div>";
}

function collectForm(form, fields) {
  const out = {};
  fields.forEach(f => {
    if (f.type === "repeater") {
      const box = form.querySelector('[data-rep="' + f.name + '"]');
      const visibleSubs = f.sub.filter(s => s.type !== "hidden" && s.type !== "select");
      out[f.name] = Array.from(box.querySelectorAll(".rep-rows .rep-row")).map(row => {
        const o = {};
        Array.from(row.querySelectorAll("[data-sub]")).forEach(inp => {
          o[inp.dataset.sub] = inp.type === "checkbox" ? inp.checked : inp.value.trim();
        });
        return o;
      }).filter(o => visibleSubs.some(s => o[s.name]));
      return;
    }
    const el = form.querySelector('[name="' + f.name + '"]');
    if (!el) return;
    if (f.type === "checkbox") out[f.name] = el.checked;
    else if (f.type === "tags") out[f.name] = el.value.split(",").map(s => s.trim()).filter(Boolean);
    else if (f.type === "number") out[f.name] = el.value === "" ? null : Number(el.value);
    else out[f.name] = el.value.trim();
  });
  return out;
}
