/* ============================================================================
   10. DERIVED DATA
   ========================================================================= */
function activeBoard() {
  const items = (S.boards && S.boards.items) || [];
  if (!items.length) return null;
  return items.find(b => b.id === S.settings.activeBoardId) || items[0];
}
function boardStats(board) {
  const out = { total: 0, done: 0, overdue: 0, percent: 0, byColumn: [] };
  if (!board) return out;
  const finished = doneColumn(board);
  board.columns.forEach(col => {
    const n = board.tasks.filter(t => t.columnId === col.id).length;
    out.byColumn.push({ col: col, count: n });
    out.total += n;
    if (finished && col.id === finished.id) out.done += n;
  });
  out.overdue = board.tasks.filter(t => isOverdue(t, board)).length;
  out.percent = out.total ? Math.round((out.done / out.total) * 100) : 0;
  return out;
}
function isOverdue(task, board) {
  if (!task.due) return false;
  const finished = doneColumn(board);
  if (finished && task.columnId === finished.id) return false;
  return daysUntil(task.due) < 0;
}
/** Percentage of ticked rows in a checklist-style repeater. */
function checklistProgress(rows, key) {
  const list = rows || [];
  if (!list.length) return 0;
  return Math.round((list.filter(r => r[key || "done"]).length / list.length) * 100);
}

/* --------------------------------------------------------------- tasks --- */
/**
 * A board counts towards the Sprint unless it was explicitly turned off — so a
 * private board keeps personal to-dos out of the burndown and the velocity.
 * Boards made before this setting existed keep counting, as they always did.
 */
function tracksSprint(board) {
  return !!board && board.tracksSprint !== false;
}
/** Every task across every board, paired with the board it belongs to. */
function allTasks(trackedOnly) {
  const out = [];
  ((S.boards && S.boards.items) || []).forEach(b => {
    if (trackedOnly && !tracksSprint(b)) return;
    (b.tasks || []).forEach(t => out.push({ t: t, board: b }));
  });
  return out;
}
function isTaskDone(task, board) {
  const finished = doneColumn(board);
  return !!finished && task.columnId === finished.id;
}
function taskPoints(t) {
  const n = Number(t && t.points);
  return isFinite(n) && n > 0 ? n : 0;
}
/** Points when anything is estimated, otherwise a plain head count. */
function measure(tasks, usePoints) {
  return usePoints ? tasks.reduce((a, t) => a + taskPoints(t), 0) : tasks.length;
}
/** Days a card has sat untouched in its current column. */
function cardAge(t) {
  const at = t.movedAt || t.updatedAt || t.createdAt;
  if (!at) return 0;
  return Math.max(0, Math.round((Date.now() - new Date(at).getTime()) / 86400000));
}
function isStale(t, board) {
  if (isTaskDone(t, board)) return false;
  const limit = Number(S.settings.staleCardDays) || 0;
  return limit > 0 && cardAge(t) >= limit;
}

/* ------------------------------------------------------------- sprints --- */
function activeSprint() {
  const items = (S.sprints && S.sprints.items) || [];
  return items.find(s => s.id === S.settings.activeSprintId && s.status === "active") ||
         items.find(s => s.status === "active") || null;
}
function sprintById(id) {
  return ((S.sprints && S.sprints.items) || []).find(s => s.id === id) || null;
}
function closedSprints() {
  return sortBy(((S.sprints && S.sprints.items) || []).filter(s => s.status === "closed"), s => s.start || s.end || "");
}
/** Working days (Mon–Fri) inside a sprint, as YYYY-MM-DD strings. */
function sprintDayList(sprint) {
  const out = [];
  if (!sprint || !sprint.start || !sprint.end) return out;
  const cur = new Date(sprint.start.slice(0, 10) + "T00:00:00");
  const end = new Date(sprint.end.slice(0, 10) + "T00:00:00");
  if (isNaN(cur) || isNaN(end) || end < cur) return out;
  let guard = 0;
  while (cur <= end && guard++ < 400) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) {
      out.push(new Date(cur.getTime() - cur.getTimezoneOffset() * 60000).toISOString().slice(0, 10));
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}
/** 1-based position of today inside the sprint, clamped to its length. */
function sprintDayIndex(sprint) {
  const days = sprintDayList(sprint);
  if (!days.length) return 0;
  const today = todayISO();
  const i = days.indexOf(today);
  if (i >= 0) return i + 1;
  if (today < days[0]) return 0;
  return days.length;
}
/** Committed / done / remaining for a sprint, in points or task count. */
function sprintStats(sprint) {
  const blank = { usePoints: false, unit: "tasks", total: 0, done: 0, remaining: 0, added: 0, count: 0, doneCount: 0, percent: 0 };
  if (!sprint) return blank;
  const rows = allTasks(true).filter(x => x.t.sprintId === sprint.id);
  const tasks = rows.map(x => x.t);
  const usePoints = tasks.some(t => taskPoints(t) > 0);
  const doneTasks = rows.filter(x => isTaskDone(x.t, x.board)).map(x => x.t);
  // Anything created after the sprint started is scope that arrived mid-flight.
  const added = tasks.filter(t => t.createdAt && sprint.start && t.createdAt.slice(0, 10) > sprint.start.slice(0, 10));
  const total = measure(tasks, usePoints);
  const done = measure(doneTasks, usePoints);
  return {
    usePoints: usePoints, unit: usePoints ? "pts" : "tasks",
    total: total, done: done, remaining: Math.max(0, total - done),
    added: measure(added, usePoints), count: tasks.length, doneCount: doneTasks.length,
    percent: total ? Math.round((done / total) * 100) : 0,
  };
}
/** What a sprint actually delivered. Stored on close so history cannot drift. */
function velocityOf(sprint) {
  if (!sprint) return 0;
  if (sprint.velocity !== undefined && sprint.velocity !== null && sprint.status === "closed") return Number(sprint.velocity) || 0;
  if (!sprint.start || !sprint.end) return 0;
  const from = sprint.start.slice(0, 10), to = sprint.end.slice(0, 10);
  const tasks = allTasks(true).map(x => x.t).filter(t => t.doneAt && t.doneAt.slice(0, 10) >= from && t.doneAt.slice(0, 10) <= to);
  return measure(tasks, tasks.some(t => taskPoints(t) > 0));
}
function avgVelocity(n) {
  const list = closedSprints().slice(-(n || 5)).map(velocityOf);
  if (!list.length) return 0;
  return Math.round(list.reduce((a, v) => a + v, 0) / list.length);
}
/** Average days from first move to done, plus what finished in the last fortnight. */
function cycleTimeStats() {
  const done = allTasks(true).map(x => x.t).filter(t => t.startedAt && t.doneAt);
  const spans = done.map(t => (new Date(t.doneAt) - new Date(t.startedAt)) / 86400000).filter(d => d >= 0);
  const avg = spans.length ? spans.reduce((a, d) => a + d, 0) / spans.length : 0;
  const since = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  const recent = allTasks(true).map(x => x.t).filter(t => t.doneAt && t.doneAt.slice(0, 10) >= since);
  return { avgDays: Math.round(avg * 10) / 10, sample: spans.length, throughput: recent.length };
}
/**
 * Records where the active sprint stood today. Called from every mutation, so
 * the burndown fills itself in as the sprint runs — nothing to remember.
 */
function snapshotBurndown() {
  const s = activeSprint();
  if (!s || !s.start || !s.end) return;
  const day = todayISO();
  const days = sprintDayList(s);
  // Only working days are plotted, so only working days are worth recording.
  if (days.indexOf(day) < 0) return;
  const remaining = sprintStats(s).remaining;
  s.burndown = s.burndown || [];
  const row = s.burndown.find(r => r.date === day);
  if (row) {
    if (row.remaining === remaining) return;
    row.remaining = remaining;
  } else {
    s.burndown.push({ date: day, remaining: remaining });
  }
  markDirty("sprints");
}

/* --------------------------------------------------------- impediments --- */
/** Days an impediment has been in the way. */
function impedimentAge(i) {
  if (!i.raisedOn) return 0;
  if (i.status === "resolved" && i.resolvedOn) {
    return Math.max(0, Math.round((new Date(i.resolvedOn.slice(0, 10)) - new Date(i.raisedOn.slice(0, 10))) / 86400000));
  }
  const d = daysUntil(i.raisedOn);
  return d === null ? 0 : Math.max(0, -d);
}
function openImpediments() {
  return sortBy((S.impediments.items || []).filter(i => i.status !== "resolved"), i => i.raisedOn || "9999");
}
function agedImpediments() {
  const limit = Number(S.settings.impedimentAgeAlertDays) || 3;
  return openImpediments().filter(i => impedimentAge(i) >= limit);
}

/* ---------------------------------------------------------- ceremonies --- */
const CADENCES = [
  { value: "daily", label: "Every working day" },
  { value: "sprint-start", label: "Start of each Sprint" },
  { value: "sprint-end", label: "End of each Sprint" },
  { value: "weekly", label: "Weekly" },
  { value: "adhoc", label: "When needed" },
];
function cadenceLabel(v) {
  const hit = CADENCES.find(c => c.value === v);
  return hit ? _t(hit.label) : (v || _t("When needed"));
}
/** A ceremony is "today" if it is daily on a working day, or explicitly dated. */
function ceremoniesDueToday() {
  const today = todayISO();
  const dow = new Date(today + "T00:00:00").getDay();
  const workday = dow !== 0 && dow !== 6;
  return (S.ceremonies.items || []).filter(c => {
    if (c.nextAt && c.nextAt.slice(0, 10) === today) return true;
    return c.cadence === "daily" && workday;
  });
}

/* --------------------------------------------------------------- team --- */
function isAway(member, iso) {
  return (member.absences || []).some(a => a.from && iso >= a.from.slice(0, 10) && iso <= (a.to || a.from).slice(0, 10));
}
function awayOn(iso) {
  return (S.team.items || []).filter(m => isAway(m, iso));
}
/** Person-days the team can actually give this sprint, absences deducted. */
function sprintCapacity(sprint) {
  const days = sprintDayList(sprint);
  const members = S.team.items || [];
  let available = 0, gross = 0;
  members.forEach(m => {
    const pct = m.capacityPct === undefined || m.capacityPct === "" ? 100 : Number(m.capacityPct) || 0;
    gross += days.length * (pct / 100);
    const present = days.filter(d => !isAway(m, d)).length;
    available += present * (pct / 100);
  });
  return {
    days: days.length, people: members.length,
    available: Math.round(available * 10) / 10,
    lost: Math.round((gross - available) * 10) / 10,
  };
}
/** Round-robin from the roster, based on who ran the last standup. */
function nextFacilitator() {
  const team = S.team.items || [];
  if (!team.length) return "";
  const last = sortBy(S.standups.items || [], s => s.date || "", "desc")[0];
  if (!last || !last.facilitator) return team[0].name;
  const i = team.findIndex(m => m.name === last.facilitator);
  return team[(i + 1) % team.length].name;
}
function standupOn(iso) {
  return (S.standups.items || []).find(s => (s.date || "").slice(0, 10) === iso) || null;
}

/* -------------------------------------------------- agreements / retro --- */
function agreementOf(type) {
  return (S.agreements.items || []).find(a => a.type === type) || null;
}
function dorCriteria() {
  const a = agreementOf("Definition of Ready");
  return a ? (a.items || []) : [];
}
/** How many Definition-of-Ready boxes a refinement item ticks. */
function dorScore(item) {
  const criteria = dorCriteria();
  const flags = item.dor || [];
  const met = criteria.filter((c, i) => flags[i]).length;
  return { met: met, total: criteria.length, ready: criteria.length > 0 && met === criteria.length };
}
/** Retro actions nobody has ticked off yet, oldest first. */
function openRetroActions() {
  const out = [];
  (S.retrospectives.items || []).forEach(r => {
    (r.actions || []).forEach((a, i) => {
      if (!a.done && a.text) out.push({ retro: r, action: a, index: i, date: r.date || r.createdAt || "" });
    });
  });
  return sortBy(out, x => x.date || "");
}

/** Everything that needs the Scrum Master's attention today. */
function alertItems() {
  const out = [];
  const board = activeBoard();
  const sprint = activeSprint();

  agedImpediments().forEach(i => {
    out.push({ kind: "impediment", icon: "alert", text: _tp("Impediment open {days}: {title}", { days: pluralise(impedimentAge(i), "day"), title: i.title }), when: fmtShort(i.raisedOn), view: "impediments" });
  });
  if (board) {
    board.tasks.filter(t => t.blocked && !isTaskDone(t, board) && cardAge(t) >= 2).forEach(t => {
      out.push({ kind: "blocked", icon: "alert", text: _tp("Blocked {days}: {title}", { days: pluralise(cardAge(t), "day"), title: t.title }), when: "board", view: "taskboard" });
    });
    board.tasks.filter(t => isOverdue(t, board)).forEach(t => {
      out.push({ kind: "task", icon: "clock", text: _tp("Overdue task: {title}", { title: t.title }), when: fmtShort(t.due), view: "taskboard" });
    });
  }
  if (sprint && sprint.end) {
    const left = daysUntil(sprint.end);
    const st = sprintStats(sprint);
    if (left !== null && left <= 1 && left >= 0 && st.remaining > 0) {
      out.push({ kind: "sprint", icon: "refresh", text: _tp("{name} ends {when} with {n} {unit} left", { name: sprint.name, when: left === 0 ? _t("today") : _t("tomorrow"), n: st.remaining, unit: _t(st.unit) }), when: fmtShort(sprint.end), view: "sprints" });
    }
    if (left !== null && left < 0) {
      out.push({ kind: "sprint", icon: "refresh", text: sprint.name + " ran past its end date — close it", when: fmtShort(sprint.end), view: "sprints" });
    }
  }
  ceremoniesDueToday().forEach(c => {
    out.push({ kind: "ceremony", icon: "clock", text: c.name + " is due today", when: c.timebox ? c.timebox + " min" : "", view: "ceremonies" });
  });
  openRetroActions().forEach(x => {
    const age = x.date ? -(daysUntil(x.date) || 0) : 0;
    if (age >= 14) out.push({ kind: "retro", icon: "history", text: _tp("Retro action still open: {text}", { text: x.action.text.slice(0, 60) }), when: fmtShort(x.date), view: "retrospective" });
  });
  S.notes.items.forEach(n => {
    if (n.remindAt && daysUntil(n.remindAt) <= 0) {
      out.push({ kind: "note", icon: "bell", text: _tp("Reminder: {text}", { text: n.text.slice(0, 70) }), when: fmtShort(n.remindAt), view: "notes" });
    }
  });
  S.roadmap.items.forEach(m => {
    if (m.date && m.status !== "done" && daysUntil(m.date) < 0) {
      out.push({ kind: "release", icon: "flag", text: _tp("Release past due: {title}", { title: m.title }), when: fmtShort(m.date), view: "roadmap" });
    }
  });
  S.decisions.items.forEach(d => {
    if (d.status === "pending" && d.reviewBy && daysUntil(d.reviewBy) < 0) {
      out.push({ kind: "decision", icon: "scale", text: _tp("Decision still pending: {problem}", { problem: d.problem.slice(0, 60) }), when: fmtShort(d.reviewBy), view: "decisions" });
    }
  });
  return out;
}
/** Lower-cased header search term, or "" when the box is empty. */
function matchText() {

function pageHead(title, sub, actionsHTML) {

function emptyState(icon, title, text, actionHTML, small) {

function statusBadge(status) {

  const icons = { approved: "checkCircle", pending: "dotCircle", rejected: "xCircle", superseded: "history", proposed: "info" };

function priorityBadge(p) {
  const s = (p || "medium").toLowerCase();
  return '<span class="badge b-' + s + '">' + esc(s[0].toUpperCase() + s.slice(1)) + "</span>";
}
function impactBadge(i) {
  const s = (i || "medium").toLowerCase();
  const cls = { high: "b-high", medium: "b-medium", low: "b-low", critical: "b-critical" }[s] || "b-neutral";
  return '<span class="badge ' + cls + '">' + esc(s[0].toUpperCase() + s.slice(1)) + " impact</span>";
}
function donut(segments, centreValue, centreLabel) {
  const total = segments.reduce((a, s) => a + s.value, 0);
  let offset = 0;
  const rings = segments.filter(s => s.value > 0).map(s => {
    const pct = total ? (s.value / total) * 100 : 0;
    const c = '<circle cx="18" cy="18" r="15.915" fill="none" stroke="' + s.color + '" stroke-width="3.2" stroke-dasharray="' +
      (pct - 0.6 > 0 ? pct - 0.6 : pct) + ' 100" stroke-dashoffset="' + -offset + '"></circle>';
    offset += pct;
    return c;
  }).join("");
  const track = '<circle cx="18" cy="18" r="15.915" fill="none" stroke="var(--surface-3)" stroke-width="3.2"></circle>';
  return '<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 36 36">' + track + rings + "</svg>" +
    '<div class="mid"><b>' + esc(centreValue) + "</b><span>" + esc(_t(centreLabel)) + "</span></div></div></div>";
}

/* ------------------------------------------------------------- charts --- */
/**
 * Sprint burndown. The dashed line is the ideal path from the committed total
 * down to zero across the working days; the solid line is what actually
 * happened, taken from the daily snapshots.
 */
function burndownSVG(sprint, compact) {
  const days = sprintDayList(sprint);
  const st = sprintStats(sprint);
  if (!days.length) {
    return '<p class="tiny dim" style="padding:14px 0">' + esc(_t("Give this Sprint a start and end date and the burndown draws itself.")) + '</p>';
  }
  const W = 320, H = compact ? 108 : 168, L = 26, R = 8, T = 10, B = 20;
  const plotW = W - L - R, plotH = H - T - B;
  const top = Math.max(st.total, ...(sprint.burndown || []).map(r => r.remaining), 1);
  const x = i => L + (days.length === 1 ? plotW / 2 : (i / (days.length - 1)) * plotW);
  const y = v => T + plotH - (v / top) * plotH;

  const grid = [0, 0.5, 1].map(f => {
    const yy = T + plotH * f;
    return '<line class="grid" x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '"/>' +
      '<text class="axis" x="' + (L - 5) + '" y="' + (yy + 3) + '" text-anchor="end">' + Math.round(top * (1 - f)) + "</text>";
  }).join("");

  const ideal = days.map((d, i) => x(i) + "," + y(st.total * (1 - i / Math.max(1, days.length - 1)))).join(" ");

  // Only days that were actually recorded, in sprint order.
  const map = {};
  (sprint.burndown || []).forEach(r => { map[r.date] = r.remaining; });
  const pts = [];
  days.forEach((d, i) => { if (map[d] !== undefined) pts.push({ x: x(i), y: y(map[d]), v: map[d], d: d }); });

  const actual = pts.length > 1 ? '<polyline class="actual" points="' + pts.map(p => p.x + "," + p.y).join(" ") + '"/>' : "";
  const area = pts.length > 1
    ? '<polygon class="area" points="' + pts[0].x + "," + (T + plotH) + " " + pts.map(p => p.x + "," + p.y).join(" ") + " " + pts[pts.length - 1].x + "," + (T + plotH) + '"/>'
    : "";
  const dots = pts.map(p => '<circle class="pt" cx="' + p.x + '" cy="' + p.y + '" r="2.6"><title>' + esc(_tp("{date} · {n} {unit} left", { date: fmtShort(p.d), n: p.v, unit: _t(st.unit) })) + "</title></circle>").join("");

  const ticks = days.map((d, i) => {
    if (days.length > 8 && i % Math.ceil(days.length / 6) !== 0 && i !== days.length - 1) return "";
    return '<text class="axis" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i + 1) + "</text>";
  }).join("");

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(_t("Sprint burndown")) + '">' +
    grid + '<polyline class="ideal" points="' + ideal + '"/>' + area + actual + dots + ticks + "</svg>" +
    (compact ? "" : '<div class="chart-legend"><span><i style="background:var(--text-3)"></i>' + esc(_t("Ideal")) + '</span>' +
      '<span><i style="background:var(--primary)"></i>' + esc(_tp("Actual ({unit} left)", { unit: st.unit })) + '</span>' +
      '<span class="dim">' + esc(_t("Working day →")) + '</span></div>');
}

/** One bar per closed Sprint, with the average across them. */
function velocitySVG(sprints) {
  if (!sprints.length) return "";
  const W = 320, H = 150, L = 26, R = 8, T = 10, B = 26;
  const plotW = W - L - R, plotH = H - T - B;
  const vals = sprints.map(velocityOf);
  const top = Math.max(1, ...vals);
  const avg = Math.round(vals.reduce((a, v) => a + v, 0) / vals.length);
  const slot = plotW / sprints.length;
  const bw = Math.min(38, slot * 0.6);

  const grid = [0, 0.5, 1].map(f => {
    const yy = T + plotH * f;
    return '<line class="grid" x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '"/>' +
      '<text class="axis" x="' + (L - 5) + '" y="' + (yy + 3) + '" text-anchor="end">' + Math.round(top * (1 - f)) + "</text>";
  }).join("");

  const bars = sprints.map((s, i) => {
    const v = vals[i];
    const h = (v / top) * plotH;
    const cx = L + slot * i + slot / 2;
    return '<rect class="bar" x="' + (cx - bw / 2) + '" y="' + (T + plotH - h) + '" width="' + bw + '" height="' + Math.max(1, h) + '">' +
      "<title>" + esc(s.name + ": " + v) + "</title></rect>" +
      '<text class="axis" x="' + cx + '" y="' + (T + plotH - h - 4) + '" text-anchor="middle">' + v + "</text>" +
      '<text class="axis" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(shortSprintName(s.name)) + "</text>";
  }).join("");

  const avgY = T + plotH - (avg / top) * plotH;
  const avgLine = '<line class="avgline" x1="' + L + '" y1="' + avgY + '" x2="' + (W - R) + '" y2="' + avgY + '"/>';

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(_t("Velocity per Sprint")) + '">' +
    grid + bars + avgLine + "</svg>" +
    '<div class="chart-legend"><span><i style="background:var(--primary)"></i>' + esc(_t("Delivered")) + '</span>' +
    '<span><i style="background:var(--amber)"></i>' + esc(_tp("Average {n}", { n: avg })) + "</span></div>";
}
/** "Sprint 14" → "14" so the axis labels stay readable. */
function shortSprintName(name) {
  const s = String(name || "");
  const m = s.match(/(\d+)\s*$/);
  return m ? m[1] : s.slice(0, 6);
}

/* ============================================================================

   ========================================================================= */
function taskCard(t, board, col) {
  const late = isOverdue(t, board);
  const tags = (t.tags || []).slice(0, 3);
  // Struck through only in the one finished column — never in two at once.
  const finished = doneColumn(board);
  const isFinished = !!finished && col.id === finished.id;
  const stale = isStale(t, board);
  const pts = taskPoints(t);
  return `<div class="task ${t.blocked && !isFinished ? "blocked" : ""}" draggable="true" data-task-id="${t.id}" data-col-id="${col.id}" data-action="open-task">
      <div class="row" style="align-items:flex-start;gap:8px">
        ${isFinished ? `<span class="check">${ic("check", 11, 3.2)}</span>` : ""}
        <span class="t ${isFinished ? "done" : ""} grow">${esc(t.title)}</span>
        ${pts ? `<span class="pts" title="${_t("Story points")}">${pts}</span>` : ""}
      </div>
      ${t.blocked && !isFinished ? `<div class="blocked-row">
        <span class="grow">${ic("alert", 11, 2.6)}${esc(t.blockedReason || "Blocked")}</span>
        <button data-action="raise-from-task" data-task-id="${t.id}" title="${_t("Raise this as an impediment")}">${ic("upload", 12, 2.6)}</button>
      </div>` : ""}
      ${tags.length ? `<div class="row wrap" style="gap:4px">${tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : ""}
      <div class="task-foot">
        ${priorityBadge(t.priority)}
        <div class="row" style="gap:6px">
          ${stale ? `<span class="task-meta" title="${esc(_tp("Untouched for {days}", { days: pluralise(cardAge(t), "day") }))}" style="color:var(--amber)">${ic("clock", 11, 2.4)}${cardAge(t)}d</span>` : ""}
          ${t.assignee ? avatar(t.assignee) : ""}
          ${t.due ? `<span class="task-meta ${late ? "late" : ""}">${late ? ic("alert", 11, 2.4) : ""}${esc(fmtShort(t.due))}</span>` : ""}
          <span class="task-move">
            <button data-action="move-task" data-dir="-1" data-task-id="${t.id}" title="${_t("Move left")}" aria-label="${_t("Move left")}">${ic("chevL", 12, 2.6)}</button>
            <button data-action="move-task" data-dir="1" data-task-id="${t.id}" title="${_t("Move right")}" aria-label="${_t("Move right")}">${ic("chevR", 12, 2.6)}</button>
          </span>
        </div>
      </div>
    </div>`;
}

function kanbanHTML(board, compact) {
  if (!board) return "";
  const q = matchText();
  const visible = t => !q || (t.title + " " + (t.description || "") + " " + (t.assignee || "") + " " + (t.tags || []).join(" ")).toLowerCase().includes(q);
  return `<div class="kanban" style="--cols:${board.columns.length}">` + board.columns.map(col => {
    const inCol = board.tasks.filter(t => t.columnId === col.id);
    const tasks = inCol.filter(visible);
    const all = inCol.length;
    const over = col.wip && all > col.wip;
    const pts = inCol.reduce((a, t) => a + taskPoints(t), 0);
    return `<div class="kcol ${compact ? "compact" : ""}" data-accent="${esc(col.accent || "slate")}" data-col-id="${col.id}" data-drop-col="${col.id}">
        <div class="kcol-head">
          <span class="name grow truncate">${esc(_sd(col.name))}</span>
          ${pts ? `<span class="mini dim" title="${_t("Story points in this column")}">${pts}p</span>` : ""}
          ${col.wip ? `<span class="mini bold ${over ? "over" : "dim"}" title="${esc(over ? _t("Work-in-progress limit exceeded") : _t("Work-in-progress limit"))}">${all}/${col.wip}</span>` : ""}
          <span class="n">${all}</span>
        </div>
        <div class="kbody">
          ${tasks.length ? tasks.map(t => taskCard(t, board, col)).join("")
            : `<div class="empty sm" style="padding:16px 8px"><p class="mini">${q ? _t("No match here") : _t("Drop tasks here")}</p></div>`}
        </div>
        <button class="kadd" data-action="new-task" data-col-id="${col.id}">${ic("plus", 12, 2.6)}${_t("Add Task")}</button>
      </div>`;
  }).join("") + `</div>`;
}

function quickStat(icon, color, label, value, valueColor) {
  return `<div class="stat-row"><span class="row" style="gap:10px"><span style="color:${color}">${ic(icon, 16, 2.2)}</span>${esc(_t(label))}</span>
    <span class="v" style="color:${valueColor}">${value}</span></div>`;
}
function milestoneColor(m) {
  return { planned: "var(--blue)", active: "var(--purple)", done: "var(--green)", atrisk: "var(--red)" }[m.status] || "var(--primary)";
}

VIEWS.taskboard = function () {
  const board = activeBoard();
  if (!board) {
    return pageHead("Sprint Board", "Where the Sprint Backlog actually lives.") +
      `<div class="card">${emptyState("board", "No board yet",
        "Create the board. It starts with Backlog, To Do, In Progress, Review and Done — rename, recolour, WIP-limit or delete any of them afterwards.",
        `<button class="btn btn-primary" data-action="new-board">${ic("plus", 14)}${_t("Create board")}</button>`)}</div>`;
  }
  const st = boardStats(board);
  const sprint = activeSprint();
  const sp = sprintStats(sprint);
  const blocked = board.tasks.filter(t => t.blocked && !isTaskDone(t, board)).length;
  const stale = board.tasks.filter(t => isStale(t, board)).length;
  const overWip = board.columns.filter(c => c.wip && board.tasks.filter(t => t.columnId === c.id).length > c.wip);

  return `
  ${pageHead("Sprint Board", `${esc(board.name)} · ${pluralise(st.total, "card")} · ${st.done} finished${blocked ? " · " + blocked + " blocked" : ""}`, `
    ${boardSelector()}
    <button class="btn btn-ghost" data-action="edit-board">${ic("edit", 13)}${_t("Edit board")}</button>
    <button class="btn btn-ghost" data-action="new-board">${ic("plus", 13)}${_t("New board")}</button>
    <button class="btn btn-primary" data-action="new-task">${ic("plus", 14)}${_t("New Task")}</button>`)}

  ${!tracksSprint(board)
    ? `<div class="notice" style="margin-bottom:18px">${ic("user", 16)}<span>
        ${_tp("<b>{name}</b> is a private board — its cards stay out of the burndown, the velocity and the cycle time.", { name: esc(board.name) })}
        <button class="link" data-action="edit-board">${_t("Change that")}</button>.</span></div>`
    : sprint ? `<div class="notice info" style="margin-bottom:18px">${ic("refresh", 16)}<span>
        <b>${esc(sprint.name)}</b>${sprint.goal ? " — " + esc(sprint.goal) : ""} ·
        ${sp.done}/${sp.total} ${esc(sp.unit)} done, day ${sprintDayIndex(sprint)} of ${sprintDayList(sprint).length || "?"}.</span></div>`
      : `<div class="notice" style="margin-bottom:18px">${ic("info", 16)}<span>
        No Sprint is running, so nothing on this board counts towards a burndown.
        <button class="link" data-action="go" data-view="sprints">${_t("Plan one")}</button>.</span></div>`}

  ${overWip.length ? `<div class="notice danger" style="margin-bottom:18px">${ic("alert", 16)}<span>
    <b>${_t("Over the WIP limit:")}</b> ${overWip.map(c => esc(_sd(c.name)) + " (" + board.tasks.filter(t => t.columnId === c.id).length + "/" + c.wip + ")").join(", ")}.
    Finishing beats starting.</span></div>` : ""}

  <div class="card">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon">${ic("board", 18, 2.2)}</span>
        <div><h3>${esc(board.name)}</h3><span class="sub">${esc(board.description || _t("Drag cards between columns, or use the arrows on a card."))}</span></div></div>
      <div class="row">
        ${blocked ? `<span class="badge b-high">${ic("alert", 11)}${esc(_tp("{n} blocked", { n: blocked }))}</span>` : ""}
        ${stale ? `<span class="badge b-pending" title="${esc(_tp("Untouched for {days}+ days", { days: S.settings.staleCardDays || 3 }))}">${esc(_tp("{n} stale", { n: stale }))}</span>` : ""}
        <div class="progress" style="width:120px"><span style="width:${st.percent}%"></span></div>
        <b class="tiny">${st.percent}%</b>
        <button class="btn btn-ghost btn-sm" data-action="add-column">${ic("plus", 12)}${_t("Column")}</button>
      </div>
    </div>
    ${kanbanHTML(board, false)}
  </div>`;
};

/* ----------------------------------------------------------------- SPRINTS */
/** The active-Sprint banner: goal, day count, progress and scope change. */
function sprintStrip(sprint) {
  if (!sprint) {
    return `<div class="card">${emptyState("refresh", "No Sprint is running",
      "Plan a Sprint with a goal and dates. From then on the burndown, the day counter and the alerts all key off it.",
      `<button class="btn btn-primary" data-action="new-sprint">${ic("plus", 14)}${_t("Plan a Sprint")}</button>`)}</div>`;
  }
  const st = sprintStats(sprint);
  const days = sprintDayList(sprint);
  const dayNo = sprintDayIndex(sprint);
  const left = days.length ? Math.max(0, days.length - dayNo) : null;
  const cap = Number(sprint.capacityPoints) || 0;

  const pips = days.map((d, i) => {
    const cls = d === todayISO() ? "today" : (i < dayNo ? "past" : "");
    return `<i class="${cls}" title="${esc(fmtShort(d))}"></i>`;
  }).join("");

  return `<div class="sprint-strip">
    <div>
      <div class="row-between" style="align-items:flex-start">
        <div class="row" style="gap:10px">
          <span class="tile-icon">${ic("refresh", 18, 2.2)}</span>
          <div><h3 style="font-size:16px;font-weight:800">${esc(sprint.name)}</h3>
            <span class="tiny dim">${esc(fmtDate(sprint.start) || "no start")} → ${esc(fmtDate(sprint.end) || "no end")}</span></div>
        </div>
        <div class="row" style="gap:6px">
          <button class="btn btn-ghost btn-sm" data-action="copy-sprint-summary" data-id="${sprint.id}" title="${_t("Copy a plain-text summary")}">${ic("copy", 12)}${_t("Summary")}</button>
          <button class="btn btn-ghost btn-sm" data-action="edit-sprint" data-id="${sprint.id}">${ic("edit", 12)}${_t("Edit")}</button>
        </div>
      </div>
      ${sprint.goal ? `<p class="goal">${esc(sprint.goal)}</p>`
        : `<p class="goal dim" style="font-weight:500">${_t("No Sprint Goal yet")} — <button class="link" data-action="edit-sprint" data-id="${sprint.id}">${_t("add one")}</button>. ${_t("A Sprint without a goal is just a to-do list.")}</p>`}
      <div class="sprint-meta">
        <div class="m"><b>${days.length ? dayNo + "/" + days.length : "—"}</b><span>${_t("Day")}</span></div>
        <div class="m"><b>${left === null ? "—" : left}</b><span>${_t("Days left")}</span></div>
        <div class="m"><b>${st.done}/${st.total}</b><span>${esc(st.unit)} done</span></div>
        <div class="m"><b>${st.percent}%</b><span>${_t("Complete")}</span></div>
        ${cap ? `<div class="m"><b>${cap}</b><span>${_t("Forecast")}</span></div>` : ""}
      </div>
      <div class="daypips">${pips}</div>
      <div class="row" style="gap:10px;margin-top:14px">
        <div class="progress thick"><span style="width:${st.percent}%"></span></div>
      </div>
      ${st.added ? `<p class="tiny" style="margin-top:10px;color:var(--orange);font-weight:700">
        ${ic("alert", 12, 2.4)} ${st.added} ${esc(st.unit)} were added after this Sprint started — worth raising at the Review.</p>` : ""}
    </div>
    <div>
      <div class="mini bold dim" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${_t("Burndown")}</div>
      ${burndownSVG(sprint, true)}
    </div>
  </div>`;
}

function sprintRow(s) {
  const st = sprintStats(s);
  const v = velocityOf(s);
  const badge = { planned: "b-planned", active: "b-active", closed: "b-done" }[s.status] || "b-neutral";
  return `<div class="item">
    <span class="dot-sm" style="margin-top:6px;background:${s.status === "active" ? "var(--purple)" : s.status === "closed" ? "var(--green)" : "var(--blue)"}"></span>
    <div class="grow">
      <div class="row-between" style="align-items:flex-start">
        <h4>${esc(s.name)}</h4>
        <div class="row" style="gap:6px">
          <span class="badge ${badge}">${esc((s.status || "planned")[0].toUpperCase() + (s.status || "planned").slice(1))}</span>
          ${s.status === "closed" ? `<span class="badge b-neutral" title="${_t("Delivered")}">${v} delivered</span>` : ""}
        </div>
      </div>
      ${s.goal ? `<p>${esc(s.goal)}</p>` : ""}
      <div class="row wrap" style="gap:12px;margin-top:7px">
        <span class="mini dim row" style="gap:5px">${ic("calendar", 12)}${esc(fmtShort(s.start) || "—")} → ${esc(fmtShort(s.end) || "—")}</span>
        <span class="mini dim">${st.done}/${st.total} ${esc(st.unit)} · ${st.count} ${st.count === 1 ? "item" : "items"}</span>

VIEWS.sprints = function () {
  const sprint = activeSprint();
  const all = sortBy(S.sprints.items, s => s.start || "9999", "desc");
  const closed = closedSprints();
  const recent = closed.slice(-8);
  const avg = avgVelocity(5);
  const ct = cycleTimeStats();
  const cap = sprintCapacity(sprint);

  // What is left in the refinement queue, measured the same way as velocity.
  const queue = S.refinement.items.reduce((a, b) => a + (Number(b.points) || 0), 0);
  const forecast = avg > 0 && queue > 0 ? Math.ceil(queue / avg) : 0;

  return `
  ${pageHead("Sprints & Metrics", "How this Sprint is tracking, and what the last few say about the next one.", `
    <button class="btn btn-primary" data-action="new-sprint">${ic("plus", 14)}${_t("New Sprint")}</button>`)}

    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="tile-icon">${ic("chart", 18, 2.2)}</span>
          <div><h3>${_t("Burndown")}</h3><span class="sub">${sprint ? _t("Recorded automatically each day you use the tool") : _t("No active Sprint")}</span></div></div>
        ${sprint ? `<button class="btn btn-ghost btn-sm" data-action="edit-burndown" data-id="${sprint.id}">${ic("edit", 12)}${_t("Correct a day")}</button>` : ""}

      ${sprint ? burndownSVG(sprint, false)

      <div class="card-head">
        <div class="card-title"><span class="tile-icon" style="background:var(--green-weak);color:var(--green)">${ic("zap", 18, 2.2)}</span>
          <div><h3>${_t("Velocity")}</h3><span class="sub">${recent.length ? pluralise(recent.length, "closed Sprint") : _t("No closed Sprints yet")}</span></div></div>
      </div>
      ${recent.length ? velocitySVG(recent)

      ${recent.length && forecast ? `<p class="tiny muted" style="margin-top:10px;line-height:1.6">
        ${_tp("At an average of <b>{avg}</b> per Sprint, the <b>{queue}</b> points sitting in Refinement are roughly <b>{forecast}</b> of work.", { avg: avg, queue: queue, forecast: pluralise(forecast, "Sprint") })}</p>` : ""}

    <div class="stat-tile"><b>${avg || "—"}</b><span>${_t("Avg velocity")}</span><p>${_tp("Mean of the last {n} closed Sprints.", { n: Math.min(5, closed.length) || 0 })}</p></div>
    <div class="stat-tile"><b>${ct.avgDays || "—"}</b><span>${_t("Cycle time (days)")}</span><p>${ct.sample ? _tp("Across {items}.", { items: pluralise(ct.sample, "finished item") }) : _t("Move cards across the board and this fills in.")}</p></div>
    <div class="stat-tile"><b>${ct.throughput}</b><span>${_t("Done / 14 days")}</span><p>${_t("Items finished in the last two weeks.")}</p></div>
    <div class="stat-tile"><b>${cap.available || "—"}</b><span>${_t("Person-days")}</span><p>${cap.people ? _tp("{n} lost to absence this Sprint.", { n: cap.lost }) : _t("Add your team to see capacity.")}</p></div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon">${ic("list", 18, 2.2)}</span>
        <div><h3>${_t("All Sprints")}</h3><span class="sub">${esc(pluralise(all.length, "Sprint"))}</span></div></div>

}

function moodStrip(person, checks) {
  const cells = checks.map(c => {
    const row = (c.scores || []).find(s => s.person === person);
    const score = row ? Number(row.score) || 0 : 0;
    const title = fmtShort(c.date) + (row ? " · " + score + "/5" + (row.comment ? " — " + row.comment : "") : " · not asked");
    return `<i ${score ? `data-s="${score}"` : ""} title="${esc(title)}"></i>`;
  }).join("");
  return `<div class="mood">${cells}</div>`;
}

/* ------------------------------------------------------------- CEREMONIES */
function fmtTimebox(min) {
  const m = Number(min) || 0;
  if (!m) return "no timebox";
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + "h" + (r ? " " + r + "m" : "");
}

          <div class="row-between" style="align-items:flex-start">
            <h4>${esc(fmtDate(s.date))}${s.date === today ? " · today" : ""}</h4>
            <div class="row" style="gap:6px">
              ${blockers.length ? `<span class="badge b-high">${pluralise(blockers.length, "blocker")}</span>` : `<span class="badge b-done">${_t("No blockers")}</span>`}
              ${s.facilitator ? `<span class="tag">${esc(s.facilitator)}</span>` : ""}
            </div>
          </div>
          <p class="mini dim">${esc(pluralise(entries.length, "person", "people"))} spoke${s.absent ? " · absent: " + esc(s.absent) : ""}${(s.parkingLot || []).length ? " · " + pluralise((s.parkingLot || []).length, "parked topic") : ""}</p>
          ${blockers.length ? `<div class="stack-sm" style="margin-top:8px">${blockers.map((b, i) => `
            <div class="row-between" style="gap:8px">
              <span class="mini" style="color:var(--text-2)"><b>${esc(b.person || "Someone")}:</b> ${esc(b.blocker)}</span>
              <button class="btn btn-danger-soft btn-sm" data-action="blocker-to-impediment" data-id="${s.id}" data-index="${entries.indexOf(b)}">${ic("alert", 11)}${_t("Raise")}</button>
            </div>`).join("")}</div>` : ""}
        </div>
        <div class="act">
          <button data-action="open-standup" data-date="${esc(s.date)}" title="${_t("Open")}">${ic("edit", 14)}</button>
          <button class="del" data-action="delete-standup" data-id="${s.id}" title="${_t("Delete")}">${ic("trash", 14)}</button>
        </div>
      </div>`;
    }).join("")}</div>`
      : emptyState("users", "No standups recorded",
        "Record the Daily Scrum and you get a searchable history: who was there, what was blocked, and what you promised to take offline.",
        `<button class="btn btn-primary" data-action="open-standup">${ic("plus", 14)}${_t("Record today's standup")}</button>`)}
  </div>`;
};

/* ------------------------------------------------------------ IMPEDIMENTS */
function ageBadge(imp) {
  const age = impedimentAge(imp);
  const limit = Number(S.settings.impedimentAgeAlertDays) || 3;
  const cls = imp.status === "resolved" ? "" : (age >= limit * 2 ? " bad" : age >= limit ? " warn" : "");
  const word = imp.status === "resolved"
    ? _tp("cleared in {days}", { days: pluralise(age, "day") })
    : _tp("{days} open", { days: pluralise(age, "day") });
  return `<span class="age${cls}" title="Raised ${esc(fmtDate(imp.raisedOn))}">${esc(word)}</span>`;
}

function impedimentRow(i) {
  const resolved = i.status === "resolved";
  const label = { open: _t("Open"), "in-progress": _t("Being worked"), escalated: _t("Escalated"), resolved: _t("Resolved") }[i.status || "open"];
  const cls = { open: "b-high", "in-progress": "b-pending", escalated: "b-critical", resolved: "b-done" }[i.status || "open"];
  return `<div class="item imp ${resolved ? "resolved" : ""}" data-sev="${esc(i.severity || "low")}">
    <div class="grow">
      <div class="row-between" style="align-items:flex-start">
        <h4>${esc(i.title)}</h4>
        <div class="row" style="gap:6px">
          ${ageBadge(i)}
          <span class="badge ${cls}">${esc(label)}</span>
        </div>
      </div>
      ${i.description ? `<p>${esc(i.description)}</p>` : ""}
      ${resolved && i.resolution ? `<p style="color:var(--green)">${ic("check", 11, 3)} ${esc(i.resolution)}</p>` : ""}
      <div class="row wrap" style="gap:12px;margin-top:7px">
        ${i.owner ? `<span class="mini dim row" style="gap:5px">${avatar(i.owner)}${esc(i.owner)}</span>`
          : `<span class="mini" style="color:var(--orange);font-weight:700">${ic("alert", 11, 2.4)} ${_t("nobody is chasing this")}</span>`}
        ${i.raisedBy ? `<span class="mini dim">raised by ${esc(i.raisedBy)}</span>` : ""}
        ${i.escalatedTo ? `<span class="mini dim row" style="gap:5px">${ic("arrowR", 11)}${esc(i.escalatedTo)}</span>` : ""}
        ${(i.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
      </div>
    </div>
    <div class="act">
      ${resolved ? "" : `<button data-action="resolve-impediment" data-id="${i.id}" title="${_t("Mark resolved")}">${ic("checkCircle", 14)}</button>`}
      <button data-action="edit-impediment" data-id="${i.id}" title="${_t("Edit")}">${ic("edit", 14)}</button>
      <button class="del" data-action="delete-impediment" data-id="${i.id}" title="${_t("Delete")}">${ic("trash", 14)}</button>
    </div>
  </div>`;
}

VIEWS.impediments = function () {
  const q = matchText();
  let list = S.impediments.items;
  if (q) list = list.filter(i => (i.title + " " + (i.description || "") + " " + (i.owner || "") + " " + (i.raisedBy || "") + " " + (i.tags || []).join(" ")).toLowerCase().includes(q));
  if (ui.impedimentStatus && ui.impedimentStatus !== "all") list = list.filter(i => (i.status || "open") === ui.impedimentStatus);

  const open = sortBy(list.filter(i => i.status !== "resolved"), i => i.raisedOn || "9999");
  const resolved = sortBy(list.filter(i => i.status === "resolved"), i => i.resolvedOn || i.raisedOn || "", "desc");
  const counts = { all: S.impediments.items.length };
  ["open", "in-progress", "escalated", "resolved"].forEach(s => counts[s] = S.impediments.items.filter(i => (i.status || "open") === s).length);

  const aged = agedImpediments();
  const cleared = S.impediments.items.filter(i => i.status === "resolved");
  const avgClear = cleared.length ? Math.round(cleared.reduce((a, i) => a + impedimentAge(i), 0) / cleared.length) : 0;

  return `
  ${pageHead("Impediments", "Everything standing between the team and the Sprint Goal. Oldest first, because age is the problem.", `
    <select class="sel sel-auto" data-action="set-impediment-status">
      ${["all", "open", "in-progress", "escalated", "resolved"].map(s =>
        `<option value="${s}" ${(ui.impedimentStatus || "all") === s ? "selected" : ""}>${
          { all: _t("All"), open: _t("Open"), "in-progress": _t("Being worked"), escalated: _t("Escalated"), resolved: _t("Resolved") }[s]} (${counts[s] || 0})</option>`).join("")}
    </select>
    <button class="btn btn-primary" data-action="new-impediment">${ic("plus", 14)}${_t("Raise Impediment")}</button>`)}

  <div class="grid-4" style="margin-bottom:20px">
    <div class="stat-tile"><b>${counts.open + counts["in-progress"] + counts.escalated}</b><span>${_t("Still in the way")}</span><p>${_t("Across every status that is not resolved.")}</p></div>
    <div class="stat-tile" style="${aged.length ? "border-color:var(--red)" : ""}"><b style="${aged.length ? "color:var(--red)" : ""}">${aged.length}</b><span>${_t("Aging")}</span><p>${_tp("Open {n}+ days. These need escalating.", { n: S.settings.impedimentAgeAlertDays || 3 })}</p></div>
    <div class="stat-tile"><b>${counts.escalated}</b><span>${_t("Escalated")}</span><p>${_t("Handed to someone outside the team.")}</p></div>
    <div class="stat-tile"><b>${avgClear || "—"}</b><span>${_t("Avg days to clear")}</span><p>${cleared.length ? _tp("Across {items}.", { items: pluralise(cleared.length, "resolved impediment") }) : _t("Nothing resolved yet.")}</p></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon" style="background:var(--red-weak);color:var(--red)">${ic("alert", 18, 2.2)}</span>
        <div><h3>${_t("In the way now")}</h3><span class="sub">${open.length ? esc(pluralise(open.length, "impediment")) : _t("Nothing blocking — enjoy it")}</span></div></div>
    </div>
    ${open.length ? `<div class="stack-sm">${open.map(impedimentRow).join("")}</div>`
      : S.impediments.items.length
        ? emptyState("checkCircle", "Nothing open", "Every impediment on the register has been cleared.", "", true)
        : emptyState("alert", "No impediments raised",
          "Raise one the moment something stalls the team. The age counter is the point — it is what turns a quiet blocker into a conversation with management.",
          `<button class="btn btn-primary" data-action="new-impediment">${ic("plus", 14)}${_t("Raise your first impediment")}</button>`)}
  </div>

  ${resolved.length ? `<div class="card" style="margin-top:20px">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon" style="background:var(--green-weak);color:var(--green)">${ic("checkCircle", 18, 2.2)}</span>
        <div><h3>${_t("Cleared")}</h3><span class="sub">${esc(pluralise(resolved.length, "impediment"))} · ${_t("kept because the same wall comes back")}</span></div></div>
    </div>
    <div class="stack-sm">${resolved.slice(0, 25).map(impedimentRow).join("")}</div>
  </div>` : ""}`;
};

/* ------------------------------------------------------------- DECISIONS */
function decisionTable(list, compact) {
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr>
      <th>${_t("Problem statement")}</th><th>${_t("Decision")}</th><th>${_t("Approved by")}</th><th>${_t("Status")}</th><th>${_t("Impact")}</th><th>${_t("Date")}</th><th style="text-align:right">${_t("Actions")}</th>
    </tr></thead>
    <tbody>${list.map(d => `<tr data-action="open-decision" data-id="${d.id}" style="cursor:pointer">
      <td class="cell-strong cell-w">${esc(d.problem)}
        ${!compact && d.tags && d.tags.length ? `<div class="row wrap" style="gap:4px;margin-top:6px">${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </td>
      <td class="muted cell-w">${esc(d.decision || "—")}</td>
      <td>${d.approver ? `<div class="row" style="gap:7px">${avatar(d.approver)}<div><div style="font-weight:600">${esc(d.approver)}</div>
        ${d.approverRole ? `<div class="mini dim">(${esc(d.approverRole)})</div>` : ""}</div></div>` : '<span class="dim">—</span>'}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${impactBadge(d.impact)}</td>
      <td class="muted" style="white-space:nowrap">${esc(fmtDate(d.date))}</td>
      <td><div class="act">
        <button data-action="edit-decision" data-id="${d.id}" title="${_t("Edit")}">${ic("edit", 14)}</button>
        <button class="del" data-action="delete-decision" data-id="${d.id}" title="${_t("Delete")}">${ic("trash", 14)}</button>
      </div></td>
    </tr>`).join("")}</tbody></table></div>`;
}

VIEWS.decisions = function () {
  const q = matchText();
  let list = S.decisions.items;
  if (ui.decisionStatus !== "all") list = list.filter(d => (d.status || "pending") === ui.decisionStatus);
  if (q) list = list.filter(d => (d.problem + " " + (d.decision || "") + " " + (d.rationale || "") + " " + (d.approver || "") + " " + (d.tags || []).join(" ")).toLowerCase().includes(q));
  list = sortBy(list, d => d.date || "", "desc");

  const counts = { all: S.decisions.items.length };
  ["approved", "pending", "rejected", "superseded", "proposed"].forEach(s => counts[s] = S.decisions.items.filter(d => (d.status || "pending") === s).length);

  return `
  ${pageHead("Decision Log", "The record of what was decided, by whom, and — most importantly — why.", `
    <select class="sel sel-auto" data-action="set-decision-status">
      ${["all", "proposed", "pending", "approved", "rejected", "superseded"].map(s =>
        `<option value="${s}" ${ui.decisionStatus === s ? "selected" : ""}>${s === "all" ? _t("All status") : vlabel("status", s)} (${counts[s] || 0})</option>`).join("")}
    </select>
    <button class="btn btn-primary" data-action="new-decision">${ic("plus", 14)}${_t("New Decision")}</button>`)}

  <div class="card">
    ${list.length ? decisionTable(list, false)
      : S.decisions.items.length
        ? emptyState("search", "No decisions match", "Try a different filter or clear the search box.")
        : emptyState("scale", "Nothing decided yet",
          "Log a decision the moment you make it: the problem, the options you turned down, the reason you chose this one. Six months from now that context is the whole point.",
          `<button class="btn btn-primary" data-action="new-decision">${ic("plus", 14)}${_t("Log your first decision")}</button>`)}
  </div>`;
};

/* ----------------------------------------------------------------- ROADMAP */
VIEWS.roadmap = function () {
  const q = matchText();
  let list = S.roadmap.items;
  if (q) list = list.filter(m => (m.title + " " + (m.notes || "")).toLowerCase().includes(q));
  list = sortBy(list, m => m.date || "9999-12-31");

  const groups = {};
  list.forEach(m => { const k = quarterOf(m.date); (groups[k] = groups[k] || []).push(m); });
  const keys = Object.keys(groups);

  return `
  ${pageHead("Releases", "The dates outside the Sprint that the team is working towards, grouped by quarter.", `
    <button class="btn btn-primary" data-action="new-milestone">${ic("plus", 14)}${_t("New Release")}</button>`)}
  ${keys.length ? keys.map(k => `
    <div class="card" style="margin-bottom:16px">
      <div class="card-head" style="margin-bottom:12px">
        <div class="card-title"><span class="tile-icon">${ic("flag", 17, 2.2)}</span>
          <div><h3>${esc(k)}</h3><span class="sub">${esc(pluralise(groups[k].length, "release"))}</span></div></div>
      </div>
      <div class="stack-sm">${groups[k].map(m => {
        const d = daysUntil(m.date);
        const late = d !== null && d < 0 && m.status !== "done";
        return `<div class="item">
          <span class="dot-sm" style="background:${esc(milestoneColor(m))};margin-top:6px"></span>
          <div class="grow">
            <div class="row-between" style="align-items:flex-start">
              <h4>${esc(m.title)}</h4>
              <div class="row" style="gap:6px">
                <span class="badge b-${esc(m.status || "planned")}">${esc((m.status || "planned")[0].toUpperCase() + (m.status || "planned").slice(1))}</span>
                ${late ? '<span class="badge b-overdue">' + esc(_t("Overdue")) + '</span>' : ""}
              </div>
            </div>
            ${m.notes ? `<p>${esc(m.notes)}</p>` : ""}
            <div class="row" style="gap:12px;margin-top:7px">
              <span class="mini dim row" style="gap:5px">${ic("calendar", 12)}${esc(fmtDate(m.date) || "No date")}</span>
              ${d !== null ? `<span class="mini ${late ? "" : "dim"}" style="${late ? "color:var(--red);font-weight:700" : ""}">${late ? _tp("{days} late", { days: pluralise(Math.abs(d), "day") }) : d === 0 ? _t("Today") : _tp("in {days}", { days: pluralise(d, "day") })}</span>` : ""}
              ${m.owner ? `<span class="mini dim row" style="gap:5px">${avatar(m.owner)}${esc(m.owner)}</span>` : ""}
            </div>
          </div>
          <div class="act">
            <button data-action="edit-milestone" data-id="${m.id}" title="${_t("Edit")}">${ic("edit", 14)}</button>
            <button class="del" data-action="delete-milestone" data-id="${m.id}" title="${_t("Delete")}">${ic("trash", 14)}</button>
          </div>
        </div>`;
      }).join("")}</div>
    </div>`).join("")
    : `<div class="card">${emptyState("flag", "No releases yet",
        "Add the dates outside the Sprint that the team is steering towards — a release, an audit, a hard external deadline.",
        `<button class="btn btn-primary" data-action="new-milestone">${ic("plus", 14)}${_t("Add your first release")}</button>`)}</div>`}`;
};

/* -------------------------------------------------------------- REFINEMENT */
VIEWS.refinement = function () {
  const q = matchText();
  let list = sortBy(S.refinement.items, b => b.order === undefined ? 9999 : b.order);
  if (q) list = list.filter(b => (b.title + " " + (b.description || "")).toLowerCase().includes(q));

  const sprint = activeSprint();
  const criteria = dorCriteria();
  const ready = S.refinement.items.filter(b => dorScore(b).ready).length;
  const points = S.refinement.items.reduce((a, b) => a + (Number(b.points) || 0), 0);
  const avg = avgVelocity(5);

  return `
  ${pageHead("Refinement", "The queue waiting for Sprint Planning. Drag to re-rank; check each one against the Definition of Ready.", `
    <button class="btn btn-primary" data-action="new-refinement">${ic("plus", 14)}${_t("New Item")}</button>`)}

  <div class="grid-4" style="margin-bottom:20px">
    <div class="stat-tile"><b>${S.refinement.items.length}</b><span>${_t("In the queue")}</span><p>${_t("Not yet pulled into a Sprint.")}</p></div>
    <div class="stat-tile"><b>${ready}</b><span>${_t("Ready")}</span><p>${criteria.length ? _tp("Meet all {n} Definition-of-Ready criteria.", { n: criteria.length }) : _t("Write a Definition of Ready in the Playbook.")}</p></div>
    <div class="stat-tile"><b>${points || "—"}</b><span>${_t("Points queued")}</span><p>${avg ? _tp("Roughly {sprints} at the current average.", { sprints: pluralise(Math.ceil(points / avg), "Sprint") }) : _t("Estimate items to forecast.")}</p></div>
    <div class="stat-tile"><b>${sprint ? "Yes" : "No"}</b><span>${_t("Sprint to pull into")}</span><p>${sprint ? esc(_tp("{name} is running.", { name: sprint.name })) : _t("Start a Sprint before pulling items in.")}</p></div>
  </div>

  <div class="card">
    ${list.length ? `<div class="stack-sm" id="refinementList">${list.map(b => {
      const dor = dorScore(b);
      return `<div class="item" draggable="true" data-backlog-id="${b.id}">
        <span class="grip" title="${_t("Drag to reorder")}">${ic("grip", 15, 2.6)}</span>
        <div class="grow">
          <div class="row-between" style="align-items:flex-start">
            <h4>${esc(b.title)}</h4>
            <div class="row" style="gap:6px">
              ${b.value ? `<span class="badge b-low" title="${_t("Business value")}">Value ${b.value}</span>` : ""}
              ${b.points ? `<span class="badge b-neutral" title="${_t("Story points")}">${b.points} pts</span>` : `<span class="badge b-pending" title="${_t("Not estimated")}">${_t("Not sized")}</span>`}
              ${criteria.length ? (dor.ready
                ? `<span class="badge b-approved">${ic("check", 11, 3)}${_t("Ready")}</span>`
                : `<span class="badge b-pending" title="${_t("Definition of Ready")}">${dor.met}/${dor.total} ready</span>`) : ""}
            </div>
          </div>
          ${b.description ? `<p>${esc(b.description)}</p>` : ""}
        </div>
        <div class="act">
          <button data-action="pull-into-sprint" data-id="${b.id}" title="${sprint ? "Pull into " + esc(sprint.name) : "Put on the board"}">${ic("upload", 14)}</button>
          <button data-action="edit-refinement" data-id="${b.id}" title="${_t("Edit")}">${ic("edit", 14)}</button>
          <button class="del" data-action="delete-refinement" data-id="${b.id}" title="${_t("Delete")}">${ic("trash", 14)}</button>
        </div>
      </div>`;
    }).join("")}</div>`
      : emptyState("layers", "Nothing waiting",
        "Park work here before it is ready for a Sprint. Size it, walk it through the Definition of Ready, then pull it into the Sprint at Planning.",
        `<button class="btn btn-primary" data-action="new-refinement">${ic("plus", 14)}${_t("Add your first item")}</button>`)}
  </div>`;
};

/* ------------------------------------------------------------------- NOTES */
VIEWS.notes = function () {
  const q = matchText();
  let list = S.notes.items;
  if (q) list = list.filter(n => n.text.toLowerCase().includes(q));
  list = sortBy(list, n => n.createdAt || "", "desc");

  return `
  ${pageHead("Notes & Reminders", "Quick thoughts, follow-ups and things you must not forget.", `
    <button class="btn btn-primary" data-action="new-note">${ic("plus", 14)}${_t("New Note")}</button>`)}
  ${list.length ? `<div class="grid-3">${list.map(n => {
    const d = n.remindAt ? daysUntil(n.remindAt) : null;
    const due = d !== null && d <= 0;
    return `<div class="sticky-note sn-${esc(n.color || "yellow")}">
      <div class="txt">${esc(n.text)}</div>
      <div class="row-between">
        ${n.remindAt ? `<span class="mini row ${due ? "" : "dim"}" style="gap:5px;font-weight:700;${due ? "color:var(--red)" : ""}">
          ${ic("bell", 11, 2.4)}${due ? (d === 0 ? "Today" : Math.abs(d) + "d overdue") : esc(fmtShort(n.remindAt))}</span>`
          : `<span class="mini dim">${esc(relTime(n.createdAt))}</span>`}
        <div class="act">
          <button data-action="edit-note" data-id="${n.id}" title="${_t("Edit")}">${ic("edit", 13)}</button>
          <button class="del" data-action="delete-note" data-id="${n.id}" title="${_t("Delete")}">${ic("trash", 13)}</button>
        </div>
      </div>
    </div>`;
  }).join("")}</div>`
    : `<div class="card">${emptyState("note", "No notes yet",
      "Jot down anything you would otherwise lose in a chat thread. Add a reminder date and it will show up in your alerts.",
      `<button class="btn btn-primary" data-action="new-note">${ic("plus", 14)}${_t("Write your first note")}</button>`)}</div>`}`;
};

/* --------------------------------------------------------------- DOCUMENTS */

    ${list.length ? `<div class="table-wrap"><table class="tbl">

      <tbody>${list.map(d => `<tr>
        <td class="cell-strong cell-w">${esc(d.title)}${d.note ? `<div class="mini dim" style="margin-top:4px;font-weight:400">${esc(d.note)}</div>` : ""}</td>
        <td><span class="badge b-neutral">${esc(d.type || "Other")}</span></td>
        <td>${d.owner ? `<span class="row" style="gap:7px">${avatar(d.owner)}${esc(d.owner)}</span>` : '<span class="dim">—</span>'}</td>
        <td class="muted cell-w"><span class="truncate" style="display:block;max-width:260px">${esc(d.url || "—")}</span></td>
        <td class="muted" style="white-space:nowrap">${esc(fmtDate(d.updatedAt || d.createdAt))}</td>
        <td><div class="act">
          ${d.url ? `<button data-action="open-document" data-id="${d.id}" title="${_t("Open")}">${ic("external", 14)}</button>` : ""}
          <button data-action="edit-document" data-id="${d.id}" title="${_t("Edit")}">${ic("edit", 14)}</button>

/* ============================================================================
   13b. TIMEBOX TIMER
   Lives outside render() on purpose: re-rendering a view must never restart
   a timebox that is already running.
   ========================================================================= */
let timerTick = null;

function renderTimer() {
  const host = $("#timerHost");
  if (!host) return;
  const t = ui.timer;
  if (!t) { host.innerHTML = ""; return; }

  const left = t.endsAt ? Math.round((t.endsAt - Date.now()) / 1000) : t.left;
  const over = left < 0;
  const abs = Math.abs(left);
  const mm = String(Math.floor(abs / 60)).padStart(2, "0");
  const ss = String(abs % 60).padStart(2, "0");

  host.innerHTML = `<div class="timer ${over ? "over" : ""} ${t.endsAt ? "" : "paused"}">
    <span class="t">${over ? "-" : ""}${mm}:${ss}</span>
    <span class="lbl">${esc(t.label || "Timebox")}</span>
    <button data-action="timer-toggle" title="${t.endsAt ? _t("Pause") : _t("Resume")}">${ic(t.endsAt ? "minus" : "chevR", 14, 2.6)}</button>
    <button data-action="timer-add" title="${_t("Add five minutes")}">${ic("plus", 14, 2.6)}</button>
    <button data-action="timer-stop" title="${_t("Stop")}">${ic("x", 14, 2.6)}</button>
  </div>`;

  // One announcement per timebox, the moment it runs out.
  if (over && !t.announced) {
    t.announced = true;
    toast(_tp("Timebox for {event} is up.", { event: _t(t.label || "this event") }), "warn", 6000);
  }
}

function startTimer(minutes, label) {
  const secs = Math.max(1, Math.round((Number(minutes) || 15) * 60));
  ui.timer = { endsAt: Date.now() + secs * 1000, left: secs, label: label || "Timebox", announced: false };
  if (timerTick) clearInterval(timerTick);
  timerTick = setInterval(renderTimer, 1000);
  renderTimer();
}
function stopTimer() {
  ui.timer = null;
  if (timerTick) { clearInterval(timerTick); timerTick = null; }
  renderTimer();
}

/**
 * Keeps the "which column means finished?" dropdown in step with the rows
 * as they are typed in, ticked, added and removed.
 */
function wireBoardForm(form, initialDoneId) {
  const box = form.querySelector('[data-rep="columns"]');
  const select = form.querySelector('[name="doneColumnId"]');
  if (!box || !select) return;
  let preferred = initialDoneId || "";

  const sync = () => {
    const rows = Array.from(box.querySelectorAll(".rep-rows .rep-row"));
    const included = [];
    rows.forEach(row => {
      const on = row.querySelector('[data-sub="include"]').checked;
      const id = row.querySelector('[data-sub="id"]').value;
      const name = row.querySelector('[data-sub="name"]').value.trim();
      row.classList.toggle("excluded", !on);
      if (on && name) included.push({ id: id, name: name });
    });
    const wanted = select.value || preferred;
    select.innerHTML = included.length
      ? included.map(c => '<option value="' + esc(c.id) + '">' + esc(_sd(c.name)) + "</option>").join("")
      : '<option value="">' + esc(_t("— no columns yet —")) + '</option>';
    // Keep the current pick if it survived, otherwise fall back to the last column.
    if (included.some(c => c.id === wanted)) select.value = wanted;
    else if (included.length) select.value = included[included.length - 1].id;
    preferred = select.value;
  };

  box.addEventListener("input", sync);
  box.addEventListener("change", sync);
  sync();
}

function diffSummary(before, after) {
  const labels = {
    problem: "Problem", decision: "Decision", rationale: "Rationale", status: "Status",
    impact: "Impact", approver: "Approver", approverRole: "Approver role", date: "Date", reviewBy: "Revisit date",
  };
  const out = [];
  Object.keys(labels).forEach(k => {
    const a = before[k] || "", b = after[k] || "";
    if (a !== b) out.push(labels[k] + ": “" + (a || "empty") + "” → “" + (b || "empty") + "”");
  });
  if (JSON.stringify(before.options || []) !== JSON.stringify(after.options || [])) out.push("Options considered were updated");
  if ((before.tags || []).join() !== (after.tags || []).join()) out.push("Tags were updated");
  return out;
}

function byId(list, id) { return list.find(x => x.id === id); }
/** Whatever this record calls itself, for dialogs and the activity log. */
function itemLabel(item, fallback) {
  return item.title || item.problem || item.name || item.text || (item.date ? fmtDate(item.date) : "") || fallback;
}
function deleteFrom(domain, id, label) {
  const item = byId(S[domain].items, id);
  if (!item) return;
  confirmDialog({
    title: _tp("Delete this {thing}?", { thing: _t(label) }),
    message: _tp("“{name}” will be removed. This cannot be undone.", { name: String(itemLabel(item, label)).slice(0, 80) }),
    confirmLabel: "Delete", danger: true,
    onConfirm: () => mutate(domain, () => {
      S[domain].items = S[domain].items.filter(x => x.id !== id);
    }, "Deleted " + label + ": " + String(itemLabel(item, label)).slice(0, 60), "delete"),
  });
}
/**
 * Records when a card started moving and when it finished, which is where the
 * cycle-time and velocity numbers come from. Called from every move path.
 */
function stampMove(task, board, toColumnId) {
  const finished = doneColumn(board);
  const first = board.columns[0];
  task.columnId = toColumnId;
  task.updatedAt = nowISO();
  task.movedAt = nowISO();
  if (first && toColumnId !== first.id && !task.startedAt) task.startedAt = nowISO();
  if (finished && toColumnId === finished.id) {
    if (!task.doneAt) task.doneAt = nowISO();
    if (!task.startedAt) task.startedAt = task.createdAt || nowISO();
    task.blocked = false;
  } else if (task.doneAt) {
    // Dragged back out of Done — it is not finished after all.
    task.doneAt = "";
  }
}
function deleteFootBtn(action, id) {
  return `<button type="button" class="btn btn-danger-soft btn-sm" data-action="${action}" data-id="${id}">${ic("trash", 13)}${_t("Delete")}</button>`;
}

  async "wiz-folder"() {

      await start();

  async reconnect() {
    const h = window.__pendingHandle;
    if (!h) return openWizard();
    const ok = await Store.grant(h);
    if (!ok) { toast("Permission denied — your files were not touched.", "warn", 5000); return; }
    Store.mode = "folder"; Store.dir = h; Store.folderName = h.name;
    await start();
    toast(_tp("Reconnected to {name}.", { name: h.name }), "ok");

  async "switch-to-folder"() {
    try {
      const prev = JSON.parse(JSON.stringify(S));
      await Store.pickFolder();
      if (await folderHasData()) { openFolderConflict(prev); return; }
      saveConfig({ mode: "folder" });
      S = prev;
      DOMAINS.forEach(markDirty);
      await flush();
      S.settings.storageMode = "folder";
      render();
      toast(_tp("Everything copied into {name}.", { name: Store.folderName }), "ok", 4000);

      if (e && e.name === "AbortError") return;

        saveConfig({ mode: "local" });

  "export-all"() {
    const bundle = { app: "sm-dashboard", version: SCHEMA_VERSION, exportedAt: nowISO(), data: S };
    download("sm-workspace-" + todayISO() + ".json", JSON.stringify(bundle, null, 2));
    toast("Backup downloaded.", "ok");
  },
  "import-all"() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let bundle;
        try { bundle = JSON.parse(String(reader.result)); }
        catch (e) { toast("That file is not valid JSON.", "err", 5000); return; }
        const data = bundle && bundle.data ? bundle.data : bundle;
        if (!data || typeof data !== "object") { toast("Nothing recognisable in that file.", "err"); return; }
        let added = 0, updated = 0;
        DOMAINS.forEach(k => {
          if (!data[k]) return;
          if (k === "settings") { Object.assign(S.settings, data[k]); markDirty("settings"); return; }
          (data[k].items || []).forEach(item => {
            if (!item || !item.id) return;
            const i = S[k].items.findIndex(x => x.id === item.id);
            if (i >= 0) { S[k].items[i] = item; updated++; } else { S[k].items.push(item); added++; }
          });
          markDirty(k);
        });
        applyTheme();
        logActivity("Imported a backup (" + added + " new, " + updated + " updated)", "create");
        render();
        toast(_tp("Imported: {added} new, {updated} updated.", { added: added, updated: updated }), "ok", 4500);
      };
      reader.readAsText(file);
    });
    input.click();
  },

        : _t("Every board, sprint, impediment, standup, agreement, decision and note will be deleted. There is no undo. Consider exporting a backup first."),
      confirmLabel: "Delete everything", danger: true, requireText: "RESET",
      onConfirm: async () => {
        await Store.wipe();
        localStorage.removeItem(CONFIG_KEY);
        try { await idbDel("dir"); } catch (e) { /* fine */ }
        location.reload();
      },
    });

  "edit-board"() {

    const currentDone = doneColumn(b);
    openModal({
      title: "Edit board", width: "wide", fields: boardFields(),
      values: {
        name: b.name, description: b.description,
        tracksSprint: tracksSprint(b),
        columns: b.columns.map(c => Object.assign({}, c, { include: true })),
        doneColumnId: currentDone ? currentDone.id : "",
      },
      footLeftHTML: `<button type="button" class="btn btn-danger-soft btn-sm" data-action="delete-board">${ic("trash", 13)}${_t("Delete board")}</button>`,
      afterRender: form => wireBoardForm(form, currentDone ? currentDone.id : ""),
      onSave: v => {
        const cols = normaliseColumns(v.columns, b.columns, v.doneColumnId);
        if (!cols.length) { toast("A board needs at least one column.", "warn", 4000); return; }

        // Warn before quietly relocating tasks out of a column that is going away.
        const validIds = cols.map(c => c.id);
        const orphans = b.tasks.filter(t => !validIds.includes(t.columnId));
        const apply = () => {
          closeAllModals();
          mutate("boards", () => {
            b.name = v.name; b.description = v.description;
            b.tracksSprint = !!v.tracksSprint;
            b.tasks.forEach(t => { if (!validIds.includes(t.columnId)) t.columnId = cols[0].id; });

          toast(orphans.length ? _tp("{tasks} moved to {column}.", { tasks: pluralise(orphans.length, "task"), column: cols[0].name }) : "Board updated.", "ok", 4000);

          title: _tp("Move {tasks}?", { tasks: pluralise(orphans.length, "task") }),
          messageHTML: _tp("You removed {columns} that still {holds}. {tasks} will move to <b>{column}</b>.", {
            columns: pluralise(b.columns.length - cols.length, "column"),
            holds: orphans.length === 1 ? _t("holds a task") : _t("hold tasks"),
            tasks: pluralise(orphans.length, "task"),

          const task = Object.assign({ id: uid("task"), createdAt: nowISO(), updatedAt: nowISO(), movedAt: nowISO() }, v);
          // A card created straight into a later column has already started.
          if (colId !== b.columns[0].id) task.startedAt = nowISO();
          if (doneColumn(b) && task.columnId === doneColumn(b).id) { task.startedAt = task.startedAt || nowISO(); task.doneAt = nowISO(); }

        }, "Added task: " + v.title, "create");

      subtitle: t.doneAt ? "Finished " + fmtDate(t.doneAt) : (t.startedAt ? "In flight for " + pluralise(Math.max(0, Math.round((Date.now() - new Date(t.startedAt)) / 86400000)), "day") : ""),

  "delete-task"(el) {
    const b = activeBoard();
    const t = byId(b.tasks, el.dataset.id);

  "move-task"(el) {
    const b = activeBoard();
    const t = byId(b.tasks, el.dataset.taskId);
    if (!t) return;
    const i = b.columns.findIndex(c => c.id === t.columnId);
    const next = i + Number(el.dataset.dir);
    if (next < 0 || next >= b.columns.length) return;
    const target = b.columns[next];
    const over = target.wip && b.tasks.filter(x => x.columnId === target.id).length >= target.wip;
    mutate("boards", () => { stampMove(t, b, target.id); },
      "Moved “" + t.title + "” to " + target.name, "move");
    if (over) toast(_tp("{column} is over its WIP limit of {limit} — finish something before starting more.", { column: target.name, limit: target.wip }), "warn", 5000);

    openModal({

      saveLabel: "Close Sprint",

/**
 * Turn editor rows into board columns.
 * Only included, named rows survive, and exactly one column is marked finished.
 * Returns [] when nothing is left — the caller refuses the save rather than
 * silently resurrecting the defaults.
 */
function normaliseColumns(rows, existing, doneColumnId) {
  const out = (rows || []).filter(r => r.include && r.name).map(r => {
    const prev = r.id ? existing.find(c => c.id === r.id) : null;
    return {
      id: (prev && prev.id) || r.id || uid("col"),
      name: r.name,
      accent: r.accent || "slate",
      isDone: false,
      wip: r.wip === undefined || r.wip === "" ? (prev ? prev.wip : undefined) : (Number(r.wip) || undefined),
    };
  });
  if (!out.length) return out;
  const chosen = out.find(c => c.id === doneColumnId) || out[out.length - 1];
  chosen.isDone = true;
  return out;
}

/** The one column that means finished. Tolerates malformed stored data. */
function doneColumn(board) {
  if (!board || !board.columns || !board.columns.length) return null;
  const flagged = board.columns.filter(c => c.isDone);
  return flagged.length ? flagged[flagged.length - 1] : null;
}

async function folderHasData() {
  for (const k of DOMAINS) {
    if (k === "settings") continue;
    const doc = await Store.read(k);
    if (doc && Array.isArray(doc.items) && doc.items.length) return true;
  }
  return false;
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (el) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) {
      if (el.tagName !== "SELECT" && el.type !== "checkbox") ev.preventDefault();
      ev.stopPropagation();
      fn(el, ev);
      return;
    }
  }
  // click outside an open dropdown closes it
  if (ui.panel && !ev.target.closest(".panel")) { ui.panel = null; renderPanel(); }
  // click on the dark overlay closes the modal
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-overlay")) closeAllModals();
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-action]");
  if (el && (el.tagName === "SELECT")) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el, ev);
  }
});

/* Settings fields save as you type, without re-rendering the input you are in. */
let settingTimer = null;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "search") {
    ui.search = el.value.trim();
    clearTimeout(settingTimer);
    settingTimer = setTimeout(() => render(), 130);
    return;
  }
  if (!el.dataset || !el.dataset.setting) return;
  const path = el.dataset.setting.split(".");
  let target = S.settings;
  while (path.length > 1) target = target[path.shift()];
  target[path[0]] = el.value;
  markDirty("settings");
  renderTopbar();
  renderFocusCard();
});
