  "import-all"() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let bundle;
        try { bundle = JSON.parse(String(reader.result)); }
        catch (e) { toast("That file is not valid JSON.", "err", 5000); return; }
        const data = bundle && bundle.data ? bundle.data : bundle;
        if (!data || typeof data !== "object") { toast("Nothing recognisable in that file.", "err"); return; }
        let added = 0, updated = 0;
        DOMAINS.forEach(k => {
          if (!data[k]) return;
          if (k === "settings") { Object.assign(S.settings, data[k]); markDirty("settings"); return; }
          (data[k].items || []).forEach(item => {
            if (!item || !item.id) return;
            const i = S[k].items.findIndex(x => x.id === item.id);
            if (i >= 0) { S[k].items[i] = item; updated++; } else { S[k].items.push(item); added++; }
          });
          markDirty(k);
        });
        applyTheme();
        logActivity("Imported a backup (" + added + " new, " + updated + " updated)", "create");
        render();
        toast("Imported: " + added + " new, " + updated + " updated.", "ok", 4500);
      };
      reader.readAsText(file);
    });
    input.click();
  },

/**
 * Turn editor rows into board columns.
 * Only included, named rows survive, and exactly one column is marked finished.
 * Returns [] when nothing is left — the caller refuses the save rather than
 * silently resurrecting the defaults.
 */
function normaliseColumns(rows, existing, doneColumnId) {
  const out = (rows || []).filter(r => r.include && r.name).map(r => {
    const prev = r.id ? existing.find(c => c.id === r.id) : null;
    return {
      id: (prev && prev.id) || r.id || uid("col"),
      name: r.name,
      accent: r.accent || "slate",
      isDone: false,
      wip: prev ? prev.wip : undefined,
    };
  });
  if (!out.length) return out;
  const chosen = out.find(c => c.id === doneColumnId) || out[out.length - 1];
  chosen.isDone = true;
  return out;
}

/** The one column that means finished. Tolerates malformed stored data. */
function doneColumn(board) {
  if (!board || !board.columns || !board.columns.length) return null;
  const flagged = board.columns.filter(c => c.isDone);
  return flagged.length ? flagged[flagged.length - 1] : null;
}

async function folderHasData() {
  for (const k of DOMAINS) {
    if (k === "settings") continue;
    const doc = await Store.read(k);
    if (doc && Array.isArray(doc.items) && doc.items.length) return true;
  }
  return false;
}

/** Folder already holds a workspace and the user is switching storage into it. */
function openFolderConflict(current) {
  $("#modalHost").innerHTML =
    `<div class="overlay"><div class="modal">
      <div class="modal-head"><div><h3>That folder already has a workspace</h3>
        <p>${esc(Store.folderName)} contains saved data. Nothing has been written yet — choose what should happen.</p></div></div>
      <div class="modal-body stack">
        <button class="choice" data-action="conflict-load">
          <span class="ic">${ic("folder", 20)}</span>
          <span><h4>Open the folder's workspace</h4><p>Load what is already there and work on it from now on. Recommended — nothing is overwritten.</p></span>
        </button>
        <button class="choice" data-action="conflict-replace">
          <span class="ic" style="background:var(--red-weak);color:var(--red)">${ic("alert", 20)}</span>
          <span><h4>Replace it with what I have open</h4><p>Overwrites the JSON files in that folder with the workspace currently on screen. Cannot be undone.</p></span>
        </button>
        <button class="btn btn-ghost btn-block" data-action="modal-close">Cancel</button>
      </div></div></div>`;
  window.__conflictSnapshot = current;
}
ACTIONS["conflict-load"] = async function () {
  saveConfig({ mode: "folder" });
  await start();
  toast("Opened the workspace from " + Store.folderName + ".", "ok", 4000);
};
ACTIONS["conflict-replace"] = function () {
  confirmDialog({
    title: "Overwrite the files in that folder?",
    message: "The workspace stored in " + Store.folderName + " will be replaced by the one on screen.",
    confirmLabel: "Overwrite", danger: true, requireText: "OVERWRITE",
    onConfirm: async () => {
      S = window.__conflictSnapshot;
      saveConfig({ mode: "folder" });
      S.settings.storageMode = "folder";
      DOMAINS.forEach(markDirty);
      await flush();
      closeAllModals();
      render();
      toast("Folder overwritten with your current workspace.", "ok", 4000);
    },
  });
};

function saveConfig(cfg) {
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* private mode */ }
}

/* ============================================================================
   18. EVENT WIRING
   ========================================================================= */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (el) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) {
      if (el.tagName !== "SELECT" && el.type !== "checkbox") ev.preventDefault();
      ev.stopPropagation();
      fn(el, ev);
      return;
    }
  }
  // click outside an open dropdown closes it
  if (ui.panel && !ev.target.closest(".panel")) { ui.panel = null; renderPanel(); }
  // click on the dark overlay closes the modal
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-overlay")) closeAllModals();
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-action]");
  if (el && (el.tagName === "SELECT")) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el, ev);
  }
});

/* Settings fields save as you type, without re-rendering the input you are in. */
let settingTimer = null;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "search") {
    ui.search = el.value.trim();
    clearTimeout(settingTimer);
    settingTimer = setTimeout(() => render(), 130);
    return;
  }
  if (!el.dataset || !el.dataset.setting) return;
  const path = el.dataset.setting.split(".");
  let target = S.settings;
  while (path.length > 1) target = target[path.shift()];
  target[path[0]] = el.value;
  markDirty("settings");
  renderTopbar();
  renderFocusCard();
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {
    if ($("#modalHost").innerHTML && !$("#modalHost .wizard")) { closeAllModals(); return; }
    if (ui.panel) { ui.panel = null; renderPanel(); }
  }
});

/* ---------------------------------------------------------- drag and drop */
let dragTaskId = null;
let dragBacklogId = null;

document.addEventListener("dragstart", ev => {
  const task = ev.target.closest && ev.target.closest(".task");
  if (task) {
    dragTaskId = task.dataset.taskId;
    task.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragTaskId);
    return;
  }
  const row = ev.target.closest && ev.target.closest("[data-backlog-id]");
  if (row) {
    dragBacklogId = row.dataset.backlogId;
    row.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragBacklogId);
  }
});
document.addEventListener("dragend", () => {
  dragTaskId = null; dragBacklogId = null;
  $$(".dragging").forEach(e => e.classList.remove("dragging"));
  $$(".drop-on").forEach(e => e.classList.remove("drop-on"));
  $$(".drag-target").forEach(e => e.classList.remove("drag-target"));
});
document.addEventListener("dragover", ev => {
  if (dragTaskId) {
    // The whole column is the drop zone, header and "Add Task" strip included.
    const col = ev.target.closest("[data-drop-col]");
    if (!col) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    $$(".drop-on").forEach(e => e.classList.remove("drop-on"));
    col.classList.add("drop-on");
    return;
  }
  if (dragBacklogId) {
    const row = ev.target.closest("[data-backlog-id]");
    if (!row || row.dataset.backlogId === dragBacklogId) return;
    ev.preventDefault();
    $$(".drag-target").forEach(e => e.classList.remove("drag-target"));
    row.classList.add("drag-target");
  }
});
document.addEventListener("drop", ev => {
  if (dragTaskId) {
    const col = ev.target.closest("[data-drop-col]");
    if (!col) return;
    ev.preventDefault();
    const board = activeBoard();
    const colId = col.dataset.dropCol;
    const idx = board.tasks.findIndex(t => t.id === dragTaskId);
    if (idx < 0) return;
    const moved = board.tasks[idx];
    const from = board.columns.find(c => c.id === moved.columnId);
    const to = board.columns.find(c => c.id === colId);
    const beforeEl = insertBefore($(".kbody", col) || col, ev.clientY);
    mutate("boards", () => {
      board.tasks.splice(idx, 1);
      moved.columnId = colId;
      moved.updatedAt = nowISO();
      const at = beforeEl ? board.tasks.findIndex(t => t.id === beforeEl.dataset.taskId) : -1;
      if (at >= 0) board.tasks.splice(at, 0, moved); else board.tasks.push(moved);
    }, from && to && from.id !== to.id ? "Moved “" + moved.title + "” from " + from.name + " to " + to.name : null, "move");
    dragTaskId = null;
    return;
  }
  if (dragBacklogId) {
    const row = ev.target.closest("[data-backlog-id]");
    if (!row) return;
    ev.preventDefault();
    const list = sortBy(S.backlog.items, b => b.order === undefined ? 9999 : b.order);
    const from = list.findIndex(b => b.id === dragBacklogId);
    let to = list.findIndex(b => b.id === row.dataset.backlogId);
    if (from < 0 || to < 0 || from === to) return;
    mutate("backlog", () => {
      const [item] = list.splice(from, 1);
      list.splice(to, 0, item);
      list.forEach((b, i) => { b.order = i; });
      S.backlog.items = list;
    });
    dragBacklogId = null;
  }
});
/** The card the dragged one should be inserted before, based on pointer Y. */
function insertBefore(container, y) {
  const cards = $$(".task:not(.dragging)", container);
  let best = null, bestOffset = Number.NEGATIVE_INFINITY;
  cards.forEach(card => {
    const box = card.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = card; }
  });
  return best;
}

window.addEventListener("hashchange", () => {
  const v = location.hash.replace("#/", "");
  if (VIEWS[v] && v !== ui.view) { ui.view = v; ui.keepScroll = false; render(); }
});
window.addEventListener("beforeunload", ev => {
  if (!dirty.size) return;
  if (Store.mode === "local") {
    // localStorage is synchronous, so a pending save can still land on the way out.
    dirty.forEach(k => { try { Store.write(k, S[k]); } catch (e) { /* nothing else to try */ } });
    dirty.clear();
    return;
  }
  // Writing to disk is async and cannot finish here — let the user decide.
  ev.preventDefault();
  ev.returnValue = "";
});

/* ============================================================================
   19. BOOT
   ========================================================================= */
async function start() {
  await loadAll();
  ui.ready = true;
  closeAllModals();
  const v = location.hash.replace("#/", "");
  if (VIEWS[v]) ui.view = v;
  render();
}

async function boot() {
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); } catch (e) { /* ignore */ }

  if (!cfg) { openWizard(); return; }

  if (cfg.mode === "folder") {
    let handle = null;
    try { handle = await idbGet("dir"); } catch (e) { /* ignore */ }
    if (!handle) {
      toast("This browser could not remember your folder — please pick it again.", "warn", 6000);
      openWizard();
      return;
    }
    const perm = handle.queryPermission ? await handle.queryPermission({ mode: "readwrite" }) : "granted";
    if (perm !== "granted") { openReconnect(handle); return; }
    Store.mode = "folder";
    Store.dir = handle;
    Store.folderName = handle.name;
  } else {
    Store.mode = "local";
  }
  await start();
}

boot();
