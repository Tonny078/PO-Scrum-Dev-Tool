VIEWS.overview = function () {
  const board = activeBoard();
  const boards = S.boards.items;
  const st = boardStats(board);
  const debt = openDebt().slice(0, 3);
  const decisions = sortBy(S.decisions.items, d => d.date || "", "desc").slice(0, 4);
  const notes = S.notes.items.slice(0, 3);
  const activity = S.activity.items.slice(0, 4);
  const snippets = sortBy(S.snippets.items, x => x.createdAt || "", "desc").slice(0, 3);
  const commands = sortBy(S.commands.items, c => c.createdAt || "", "desc").slice(0, 3);
  const weeks = throughputWeeks(8);
  const shipped = weeks.reduce((a, w) => a + w.value, 0);

  const segs = st.byColumn.filter(c => c.count > 0).map(c => ({
    value: c.count,
    color: { blue: "var(--blue)", orange: "var(--orange)", purple: "var(--purple)", green: "var(--green)", red: "var(--red)", slate: "var(--slate)" }[c.col.accent || "slate"],
  }));

  return `
  ${pageHead("Overview", "What you are working on, and what is in the way of finishing it.", `
    <button class="btn btn-ghost" data-action="focus-start">${ic("clock", 14)}Focus ${Number(S.settings.focusMinutes) || 25} min</button>
    <button class="btn btn-primary" data-action="new-task">${ic("plus", 14)}New Task</button>`)}

  <div class="grid-main">
    <div class="col-left">

      <!-- Board first -->
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="tile-icon">${ic("board", 18, 2.2)}</span>
            <div><h3>${esc(board ? board.name : "Board")}</h3>
              <span class="sub">${board
                ? esc(pluralise(st.total, "card")) + " · " + st.percent + "% done" + (boards.length > 1 ? " · " + boards.length + " boards" : "")
                : "No board yet"}</span></div>
          </div>
          <div class="row">
            ${boardSelector()}
            ${board ? `<button class="icon-btn sq" data-action="new-task" title="Add task">${ic("plus", 15, 2.4)}</button>
            <button class="icon-btn sq" data-action="go" data-view="taskboard" title="Open the full board">${ic("external", 14)}</button>` : ""}
          </div>
        </div>
        ${board ? kanbanHTML(board, true)
          : emptyState("board", "No board yet",
            "Make one board per project or repo. Switch between them from the dropdown, and the flow numbers add up across all of them.",
            `<button class="btn btn-primary" data-action="new-board">${ic("plus", 14)}Create your first board</button>`)}
        ${board && boards.length === 1 ? `<p class="mini dim" style="text-align:center;padding-top:12px">
          Working on something else too? <button class="link" data-action="new-board">Add a second board</button> — one per project keeps them apart.</p>` : ""}
      </div>

      ${boards.length > 1 ? `<div class="card">
        <div class="card-head">
          <div class="card-title"><span class="tile-icon">${ic("layers", 18, 2.2)}</span>
            <div><h3>Your boards</h3><span class="sub">${esc(pluralise(boards.length, "board"))} · click to switch</span></div></div>
          <button class="btn btn-ghost btn-sm" data-action="new-board">${ic("plus", 12)}New board</button>
        </div>
        ${allBoardsList()}
      </div>` : ""}

      <!-- Flow -->
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="tile-icon" style="background:var(--green-weak);color:var(--green)">${ic("chart", 18, 2.2)}</span>
            <div><h3>Your flow</h3><span class="sub">${shipped ? esc(pluralise(shipped, "card")) + " finished in the last 8 weeks" : "Nothing finished yet"}</span></div></div>
        </div>
        ${flowTiles()}
        ${shipped ? `<div style="margin-top:16px">${barChart(weeks, "Finished per week")}</div>` : ""}
      </div>

      <!-- Tech debt -->
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="tile-icon" style="background:var(--red-weak);color:var(--red)">${ic("bug", 18, 2.2)}</span>
            <div><h3>Tech debt</h3><span class="sub">${debt.length ? esc(pluralise(openDebt().length, "item")) + " on the books" : "Nothing logged"}</span></div></div>
          <div class="row">
            <button class="btn btn-ghost btn-sm" data-action="new-debt">${ic("plus", 12)}Log</button>
            <button class="icon-btn sq" data-action="go" data-view="debt" title="Open the register">${ic("external", 14)}</button>
          </div>
        </div>
        ${debt.length ? `<div class="stack-sm">${debt.map(d => `
          <button class="item imp" data-sev="${esc(d.severity || "low")}" data-action="edit-debt" data-id="${d.id}" style="width:100%;text-align:left">
            <div class="grow">
              <div class="row-between" style="align-items:flex-start">
                <h4>${esc(d.title)}</h4>
                <span class="age">${esc(pluralise(debtAge(d), "day"))} old</span>
              </div>
              <p class="mini dim" style="margin-top:4px">${esc(d.where || "no location noted")} · ${esc(d.severity || "low")} severity</p>
            </div>
          </button>`).join("")}</div>`
          : emptyState("checkCircle", "Nothing logged",
            "Next time you take a shortcut, log it here with what it costs. Future you will want the list.", "", true)}
      </div>

      <!-- Decisions -->
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="tile-icon">${ic("scale", 18, 2.2)}</span>
            <div><h3>Decisions</h3><span class="sub">Why the code looks the way it does</span></div></div>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-action="new-decision">${ic("plus", 12)}New</button>
            <button class="icon-btn sq" data-action="go" data-view="decisions" title="Open the log">${ic("external", 14)}</button>
          </div>
        </div>
        ${decisions.length ? decisionTable(decisions, true)
          : emptyState("scale", "Nothing recorded",
            "Write down the architecture calls as you make them — the library you picked, the pattern you rejected, and why. It is the answer to “why on earth is this like this?” eighteen months from now.",
            `<button class="btn btn-primary" data-action="new-decision">${ic("plus", 14)}Record the first one</button>`)}
      </div>

      <!-- Small cards -->
      <div class="grid-4">
        <div class="card" style="padding:16px">
          <div class="row" style="gap:8px;margin-bottom:12px">
            <span class="tile-icon sm">${ic("code", 15)}</span>
            <h4 style="font-size:12.5px;font-weight:700">Snippets</h4>
          </div>
          ${snippets.length ? `<div class="stack-sm">${snippets.map(x => `
            <button class="row-between" style="gap:6px;width:100%;text-align:left" data-action="copy-snippet" data-id="${x.id}" title="Copy the code">
              <span class="mini bold truncate" style="color:var(--text-2)">${esc(x.title)}</span>
              <span class="lang">${esc((x.language || "?").slice(0, 4))}</span></button>`).join("")}</div>`
            : `<p class="tiny dim" style="line-height:1.6">Nothing saved yet.</p>`}
          <div class="spacer"></div>
          <button class="btn btn-soft btn-sm btn-block" style="margin-top:12px" data-action="new-snippet">${ic("plus", 12, 2.6)}Add</button>
        </div>

        <div class="card" style="padding:16px">
          <div class="row" style="gap:8px;margin-bottom:12px">
            <span class="tile-icon sm" style="background:var(--slate-weak);color:var(--text-2)">${ic("terminal", 15)}</span>
            <h4 style="font-size:12.5px;font-weight:700">Commands</h4>
          </div>
          ${commands.length ? `<div class="stack-sm">${commands.map(c => `
            <button class="row-between" style="gap:6px;width:100%;text-align:left" data-action="copy-command" data-id="${c.id}" title="Copy">
              <span class="mini bold truncate" style="color:var(--text-2)">${esc(c.title)}</span>
              ${ic("copy", 12)}</button>`).join("")}</div>`
            : `<p class="tiny dim" style="line-height:1.6">Nothing saved yet.</p>`}
          <div class="spacer"></div>
          <button class="btn btn-soft btn-sm btn-block" style="margin-top:12px" data-action="new-command">${ic("plus", 12, 2.6)}Add</button>
        </div>

        <div class="card" style="padding:16px">
          <div class="row" style="gap:8px;margin-bottom:12px">
            <span class="tile-icon sm" style="background:var(--amber-weak);color:var(--amber)">${ic("note", 15)}</span>
            <h4 style="font-size:12.5px;font-weight:700">Notes</h4>
          </div>
          ${notes.length ? `<div class="sticky-note sn-yellow" style="min-height:0;padding:10px 11px;gap:6px">
              ${notes.map((n, i) => `${i ? '<div style="height:1px;background:rgba(180,140,20,.25)"></div>' : ""}
                <div class="mini" style="line-height:1.5">${esc(n.text.slice(0, 62))}${n.text.length > 62 ? "…" : ""}</div>`).join("")}
            </div>` : `<p class="tiny dim" style="line-height:1.6">Nothing noted down yet.</p>`}
          <div class="spacer"></div>
          <button class="btn btn-soft btn-sm btn-block" style="margin-top:12px" data-action="new-note">${ic("plus", 12, 2.6)}Add</button>
        </div>

        <div class="card" style="padding:16px">
          <div class="row" style="gap:8px;margin-bottom:12px">
            <span class="tile-icon sm" style="background:var(--blue-weak);color:var(--blue)">${ic("zap", 15)}</span>
            <h4 style="font-size:12.5px;font-weight:700">Recent Activity</h4>
          </div>
          ${activity.length ? `<div class="stack-sm">${activity.map(a => `<div class="row-between" style="align-items:flex-start;gap:6px">
              <span class="mini truncate" style="color:var(--text-2);font-weight:500">${esc(a.text)}</span>
              <span class="mini dim" style="white-space:nowrap">${esc(relTime(a.at))}</span></div>`).join("")}</div>`
            : `<p class="tiny dim" style="line-height:1.6">Your changes will show up here.</p>`}
          <div class="spacer"></div>
          <button class="btn btn-soft btn-sm btn-block" style="margin-top:12px" data-action="toggle-panel" data-panel="activity">View All</button>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-right">
      <div class="card">
        <div class="side-head"><span class="ic">${ic("clock", 18, 2.2)}</span><h3>Focus</h3></div>
        <p class="tiny muted" style="line-height:1.6;margin-bottom:14px">
          A timer that keeps running while you move around the tool. Stop when it rings, or do not — it is your clock.</p>
        <div class="row" style="gap:8px">
          <button class="btn btn-soft grow" data-action="focus-start">${ic("clock", 13)}${Number(S.settings.focusMinutes) || 25} min</button>
          <button class="btn btn-ghost grow" data-action="focus-start" data-min="50">50 min</button>
        </div>
      </div>

      <div class="card">
        <div class="side-head"><span class="ic">${ic("pie", 18, 2.2)}</span><h3>Board flow</h3></div>
        ${st.total ? donut(segs, st.percent + "%", "Done") : `<div style="padding:14px 0">${emptyState("pie", "Nothing to measure", "Add cards and this fills in.", "", true)}</div>`}
        <div class="stack-sm" style="gap:11px">
          ${st.byColumn.map(c => {
            const over = c.col.wip && c.count > c.col.wip;
            return `<div class="stat-row">
              <span class="row" style="gap:8px"><span class="dot-sm" style="background:${{ blue: "var(--blue)", orange: "var(--orange)", purple: "var(--purple)", green: "var(--green)", red: "var(--red)", slate: "var(--slate)" }[c.col.accent || "slate"]}"></span>${esc(c.col.name)}</span>
              <span class="v" style="${over ? "color:var(--red)" : ""}" title="${over ? "Over the WIP limit of " + c.col.wip : ""}">${c.count}${c.col.wip ? "/" + c.col.wip : ""}</span></div>`;
          }).join("") || `<p class="tiny dim" style="text-align:center">No columns yet.</p>`}
        </div>
      </div>

      <div class="card">
        <div class="side-head"><span class="ic">${ic("chart", 18, 2.2)}</span><h3>In this workspace</h3></div>
        <div class="stack-sm" style="gap:13px">
          ${quickStat("board", "var(--primary-text)", "Boards", boards.length, "var(--primary-text)")}
          ${quickStat("code", "var(--blue)", "Snippets", S.snippets.items.length, "var(--blue)")}
          ${quickStat("terminal", "var(--text-2)", "Commands", S.commands.items.length, "var(--text-2)")}
          ${quickStat("server", "var(--purple)", "Services", S.services.items.length, "var(--purple)")}
          ${quickStat("bug", "var(--red)", "Debt open", openDebt().length, "var(--red)")}
          ${quickStat("scale", "var(--green)", "Decisions", S.decisions.items.length, "var(--green)")}
        </div>
        <button class="btn btn-soft btn-block" style="margin-top:16px" data-action="go" data-view="taskboard">${ic("board", 14)}Open the board</button>
      </div>

      <div class="card">
        <div class="side-head"><span class="ic">${ic("clipboard", 18, 2.2)}</span><h3>Before you push</h3></div>
        ${(() => {
          const pr = S.checklists.items.find(c => c.type === "Pull request") || S.checklists.items[0];
          const items = pr ? (pr.items || []) : [];
          return items.length
            ? `<div class="stack-sm" style="gap:8px">${items.slice(0, 6).map(i => `
                <div class="row" style="gap:8px;align-items:flex-start">
                  <span style="color:var(--green);margin-top:2px">${ic("check", 12, 3)}</span>
                  <span class="tiny" style="line-height:1.5">${esc(i.text)}</span>
                </div>`).join("")}
              ${items.length > 6 ? `<p class="mini dim">+ ${items.length - 6} more</p>` : ""}</div>`
            : emptyState("clipboard", "No checklist", "Write the one you keep forgetting.", "", true);
        })()}
        <button class="btn btn-soft btn-block" style="margin-top:16px" data-action="go" data-view="checklists">${ic("clipboard", 14)}All checklists</button>
      </div>
    </div>
  </div>`;
};

function quickStat(icon, color, label, value, valueColor) {
  return `<div class="stat-row"><span class="row" style="gap:10px"><span style="color:${color}">${ic(icon, 16, 2.2)}</span>${esc(label)}</span>
    <span class="v" style="color:${valueColor}">${value}</span></div>`;
}

/* ------------------------------------------------------------------ BOARDS */
/** The flow numbers, shown above the board and on the Overview. */
function flowTiles() {
  const ct = cycleTimeStats();
  const wip = wipCount();
  const blocked = blockedCards().length;
  return `<div class="grid-4">
    <div class="stat-tile"><b>${wip}</b><span>In progress</span><p>Started and not finished, across every board.</p></div>
    <div class="stat-tile" style="${blocked ? "border-color:var(--red)" : ""}"><b style="${blocked ? "color:var(--red)" : ""}">${blocked}</b><span>Blocked</span><p>${blocked ? "Something is waiting on someone." : "Nothing is stuck."}</p></div>
    <div class="stat-tile"><b>${ct.avgDays || "—"}</b><span>Cycle time (days)</span><p>${ct.sample ? "Across " + pluralise(ct.sample, "finished card") + "." : "Move a card to Done to start measuring."}</p></div>
    <div class="stat-tile"><b>${ct.throughput}</b><span>Done / 14 days</span><p>What you actually shipped.</p></div>
  </div>`;
}

VIEWS.taskboard = function () {
  const board = activeBoard();
  const boards = S.boards.items;
  if (!board) {
    return pageHead("Boards", "One board per project or repo.") +
      `<div class="card">${emptyState("board", "No board yet",
        "Create one board per project. It starts with Backlog, To Do, In Progress, In Review and Done — rename, recolour, WIP-limit or delete any of them afterwards.",
        `<button class="btn btn-primary" data-action="new-board">${ic("plus", 14)}Create board</button>`)}</div>`;
  }
  const st = boardStats(board);
  const blocked = board.tasks.filter(t => t.blocked && !isTaskDone(t, board)).length;
  const stale = board.tasks.filter(t => isStale(t, board)).length;
  const overWip = board.columns.filter(c => c.wip && board.tasks.filter(t => t.columnId === c.id).length > c.wip);

  return `
  ${pageHead(board.name, board.description || (boards.length > 1 ? pluralise(boards.length, "board") + " · switch with the dropdown" : "Your work, in columns."), `
    ${boardSelector()}
    ${board.repo ? `<button class="btn btn-ghost" data-action="open-repo">${ic("branch", 13)}Repo</button>` : ""}
    <button class="btn btn-ghost" data-action="edit-board">${ic("edit", 13)}Edit board</button>
    <button class="btn btn-ghost" data-action="new-board">${ic("plus", 13)}New board</button>
    <button class="btn btn-primary" data-action="new-task">${ic("plus", 14)}New Task</button>`)}

  ${overWip.length ? `<div class="notice danger" style="margin-bottom:18px">${ic("alert", 16)}<span>
    <b>Over the WIP limit:</b> ${overWip.map(c => esc(c.name) + " (" + board.tasks.filter(t => t.columnId === c.id).length + "/" + c.wip + ")").join(", ")}.
    Finishing beats starting.</span></div>` : ""}

  <div class="card">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon">${ic("board", 18, 2.2)}</span>
        <div><h3>${esc(board.name)}</h3><span class="sub">${esc(pluralise(st.total, "card"))} · ${st.done} done · drag between columns, or use the arrows</span></div></div>
      <div class="row">
        ${blocked ? `<span class="badge b-high">${ic("alert", 11)}${blocked} blocked</span>` : ""}
        ${stale ? `<span class="badge b-pending" title="Untouched for ${S.settings.staleCardDays || 3}+ days">${stale} stale</span>` : ""}
        <div class="progress" style="width:120px"><span style="width:${st.percent}%"></span></div>
        <b class="tiny">${st.percent}%</b>
        <button class="btn btn-ghost btn-sm" data-action="add-column">${ic("plus", 12)}Column</button>
      </div>
    </div>
    ${kanbanHTML(board, false)}
  </div>

  <div style="margin-top:20px">${flowTiles()}</div>

  ${boards.length > 1 ? `<div class="card" style="margin-top:20px">
    <div class="card-head">
      <div class="card-title"><span class="tile-icon">${ic("layers", 18, 2.2)}</span>
        <div><h3>Your boards</h3><span class="sub">${esc(pluralise(boards.length, "board"))}</span></div></div>
      <button class="btn btn-ghost btn-sm" data-action="new-board">${ic("plus", 12)}New board</button>
    </div>
    ${allBoardsList()}
  </div>` : ""}`;
};

/** Every board with its counts — one click switches to it. */
function allBoardsList() {
  const active = activeBoard();
  return `<div class="stack-sm">${S.boards.items.map(b => {
    const s = boardStats(b);
    const blocked = b.tasks.filter(t => t.blocked && !isTaskDone(t, b)).length;
    const isActive = active && b.id === active.id;
    return `<button class="item" data-action="pick-board" data-id="${b.id}" style="width:100%;text-align:left;${isActive ? "border-color:var(--primary)" : ""}">
      <span class="tile-icon sm" style="background:var(--primary-weak);color:var(--primary-text);margin-top:1px">${ic("board", 14)}</span>
      <div class="grow">
        <div class="row-between" style="align-items:flex-start">
          <h4>${esc(b.name)}${isActive ? ` <span class="mini dim">· open</span>` : ""}</h4>
          <div class="row" style="gap:6px">
            ${blocked ? `<span class="badge b-high">${blocked} blocked</span>` : ""}
            <span class="badge b-neutral">${s.done}/${s.total}</span>
          </div>
        </div>
        ${b.description ? `<p>${esc(b.description)}</p>` : ""}
        <div class="row" style="gap:10px;margin-top:7px">
          <div class="progress" style="width:140px"><span style="width:${s.percent}%"></span></div>
          <span class="mini dim">${s.percent}%</span>
          ${b.repo ? `<span class="mini dim row" style="gap:4px">${ic("branch", 11)}repo</span>` : ""}
        </div>
      </div>
    </button>`;
  }).join("")}</div>`;
}

/* ---------------------------------------------------------------- SNIPPETS */
const LANGUAGES = ["JavaScript", "TypeScript", "HTML", "CSS", "SQL", "Bash", "PHP", "Python",
  "Go", "Java", "C#", "JSON", "YAML", "Regex", "Other"];

const SNIPPET_FIELDS = [
  { name: "title", label: "What it does", type: "text", required: true, placeholder: "Debounce a function" },
  { name: "language", label: "Language", type: "select", half: true, full: false, options: LANGUAGES },
  { name: "tags", label: "Tags", type: "tags", half: true, full: false, placeholder: "react, utils" },
  { name: "code", label: "Code", type: "textarea", rows: 10, required: true, placeholder: "Paste it here." },
  { name: "description", label: "Note", type: "textarea", rows: 2, placeholder: "The gotcha you will have forgotten by next time." },
];

VIEWS.snippets = function () {
  const q = matchText();
  let list = S.snippets.items;
  if (q) list = list.filter(x => (x.title + " " + (x.code || "") + " " + (x.description || "") + " " + (x.language || "") + " " + (x.tags || []).join(" ")).toLowerCase().includes(q));
  if (ui.snippetLang && ui.snippetLang !== "all") list = list.filter(x => x.language === ui.snippetLang);
  list = sortBy(list, x => x.createdAt || "", "desc");

  const langs = {};
  S.snippets.items.forEach(x => { langs[x.language || "Other"] = (langs[x.language || "Other"] || 0) + 1; });
  const langKeys = Object.keys(langs).sort();

  return `
  ${pageHead("Snippets", "The bits of code you rewrite from memory every few months. Now you do not have to.", `
    ${langKeys.length ? `<select class="sel sel-auto" data-action="set-snippet-lang">
      <option value="all" ${(ui.snippetLang || "all") === "all" ? "selected" : ""}>All languages (${S.snippets.items.length})</option>
      ${langKeys.map(k => `<option value="${esc(k)}" ${ui.snippetLang === k ? "selected" : ""}>${esc(k)} (${langs[k]})</option>`).join("")}
    </select>` : ""}
    <button class="btn btn-primary" data-action="new-snippet">${ic("plus", 14)}New Snippet</button>`)}

  ${list.length ? `<div class="grid-2" style="align-items:start">${list.map(x => `
    <div class="card">
      <div class="card-head" style="margin-bottom:12px">
        <div class="card-title">
          <span class="tile-icon">${ic("code", 17, 2.2)}</span>
          <div><h3>${esc(x.title)}</h3>
            <span class="sub row" style="gap:6px">
              <span class="lang">${esc(x.language || "Other")}</span>
              ${(x.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
            </span></div>
        </div>
        <div class="act">
          <button class="copy-btn" data-action="copy-snippet" data-id="${x.id}" title="Copy the code">${ic("copy", 15)}</button>
          <button data-action="edit-snippet" data-id="${x.id}" title="Edit">${ic("edit", 14)}</button>
          <button class="del" data-action="delete-snippet" data-id="${x.id}" title="Delete">${ic("trash", 14)}</button>
        </div>
      </div>
      ${x.description ? `<p class="tiny muted" style="margin-bottom:10px;line-height:1.6">${esc(x.description)}</p>` : ""}
      <pre class="code clamp">${esc(x.code || "")}</pre>
    </div>`).join("")}</div>`
    : `<div class="card">${S.snippets.items.length
      ? emptyState("search", "No snippet matches", "Try another language filter, or clear the search box.")

  const age = debtAge(d);
  const limit = Number(S.settings.debtAgeAlertDays) || 30;

  return `<div class="item imp ${fixed ? "resolved" : ""}" data-sev="${esc(d.severity || "low")}">
    <div class="grow">
      <div class="row-between" style="align-items:flex-start">

      ${d.description ? `<p>${esc(d.description)}</p>` : ""}

        <span class="mini dim">Severity ${esc(d.severity || "low")} · effort ${esc(d.effort || "?")}</span>
        ${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
      </div>
    </div>
    <div class="act">
      ${fixed ? "" : `<button data-action="fix-debt" data-id="${d.id}" title="Mark fixed">${ic("checkCircle", 14)}</button>`}
      <button data-action="debt-to-task" data-id="${d.id}" title="Put it on the board">${ic("upload", 14)}</button>
      <button data-action="edit-debt" data-id="${d.id}" title="Edit">${ic("edit", 14)}</button>
      <button class="del" data-action="delete-debt" data-id="${d.id}" title="Delete">${ic("trash", 14)}</button>
    </div>
  </div>`;
}

  ["403", "Forbidden", "Authenticated, but not allowed."],

  ["422", "Unprocessable", "Well-formed but semantically wrong. Validation."],

/* ============================================================================
   13b. FOCUS TIMER
   Lives outside render() on purpose: re-rendering a view must never restart
   a session that is already running.
   ========================================================================= */
let timerTick = null;

function renderTimer() {
  const host = $("#timerHost");
  if (!host) return;
  const t = ui.timer;
  if (!t) { host.innerHTML = ""; return; }

  const left = t.endsAt ? Math.round((t.endsAt - Date.now()) / 1000) : t.left;
  const over = left < 0;
  const abs = Math.abs(left);
  const mm = String(Math.floor(abs / 60)).padStart(2, "0");
  const ss = String(abs % 60).padStart(2, "0");

  host.innerHTML = `<div class="timer ${over ? "over" : ""} ${t.endsAt ? "" : "paused"}">
    <span class="t">${over ? "-" : ""}${mm}:${ss}</span>
    <span class="lbl">${esc(t.label || "Focus")}</span>
    <button data-action="timer-toggle" title="${t.endsAt ? "Pause" : "Resume"}">${ic(t.endsAt ? "minus" : "chevR", 14, 2.6)}</button>
    <button data-action="timer-add" title="Add five minutes">${ic("plus", 14, 2.6)}</button>
    <button data-action="timer-stop" title="Stop">${ic("x", 14, 2.6)}</button>
  </div>`;

  // One announcement per timebox, the moment it runs out.
  if (over && !t.announced) {
    t.announced = true;
    toast((t.label || "Focus") + " session is up — take a break.", "warn", 6000);
  }
}

function startTimer(minutes, label) {
  const secs = Math.max(1, Math.round((Number(minutes) || 15) * 60));
  ui.timer = { endsAt: Date.now() + secs * 1000, left: secs, label: label || "Focus", announced: false };
  if (timerTick) clearInterval(timerTick);
  timerTick = setInterval(renderTimer, 1000);
  renderTimer();
}
function stopTimer() {
  ui.timer = null;
  if (timerTick) { clearInterval(timerTick); timerTick = null; }
  renderTimer();
}

  const select = form.querySelector('[name="doneColumnId"]');
  if (!box || !select) return;
  let preferred = initialDoneId || "";

  const sync = () => {
    const rows = Array.from(box.querySelectorAll(".rep-rows .rep-row"));
    const included = [];
    rows.forEach(row => {
      const on = row.querySelector('[data-sub="include"]').checked;
      const id = row.querySelector('[data-sub="id"]').value;
      const name = row.querySelector('[data-sub="name"]').value.trim();
      row.classList.toggle("excluded", !on);
      if (on && name) included.push({ id: id, name: name });
    });
    const wanted = select.value || preferred;
    select.innerHTML = included.length
      ? included.map(c => '<option value="' + esc(c.id) + '">' + esc(c.name) + "</option>").join("")
      : '<option value="">— no columns yet —</option>';
    // Keep the current pick if it survived, otherwise fall back to the last column.
    if (included.some(c => c.id === wanted)) select.value = wanted;
    else if (included.length) select.value = included[included.length - 1].id;
    preferred = select.value;
  };

  box.addEventListener("input", sync);
  box.addEventListener("change", sync);
  sync();
}

   ========================================================================= */
function decisionRecordHTML(d) {
  const opts = d.options || [];
  const hist = (d.history || []).slice().reverse();
  const block = (label, body) => `<div style="margin-bottom:18px"><div class="mini bold dim" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${esc(label)}</div>${body}</div>`;
  return `
    <div class="row wrap" style="gap:8px;margin-bottom:18px">
      ${statusBadge(d.status)}${impactBadge(d.impact)}
      <span class="badge b-neutral">${ic("calendar", 11)}${esc(fmtDate(d.date) || "no date")}</span>
      ${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    </div>
    ${block("Problem statement", `<p style="font-size:13.5px;font-weight:600;line-height:1.6">${esc(d.problem)}</p>`)}
    ${block("Decision taken", `<p style="font-size:13px;line-height:1.65">${esc(d.decision || "— not recorded —")}</p>`)}
    ${block("Why this one", `<p style="font-size:13px;line-height:1.65;color:var(--text-2)">${esc(d.rationale || "— not recorded —")}</p>`)}
    ${opts.length ? block("Options considered", `<div class="stack-sm">${opts.map(o => `<div class="item" style="padding:10px 12px">
        <div class="grow"><h4>${esc(o.label)}</h4>${o.why ? `<p>${esc(o.why)}</p>` : ""}</div></div>`).join("")}</div>`) : ""}
    ${d.approver ? block("Approved by", `<div class="row" style="gap:10px">${avatar(d.approver, "md")}
      <div><div style="font-weight:600">${esc(d.approver)}</div><div class="tiny dim">${esc(d.approverRole || "")}</div></div></div>`) : ""}
    ${d.reviewBy ? block("Revisit by", `<p class="tiny muted">${esc(fmtDate(d.reviewBy))}</p>`) : ""}
    ${block("History", hist.length ? `<div class="timeline">${hist.map(h => `<div class="tl-item">
        <div class="when">${esc(fmtDate(h.at))} · ${esc(relTime(h.at))}</div>
        <div class="what">${esc(h.text)}</div></div>`).join("")}</div>`
      : '<p class="tiny dim">No changes recorded yet.</p>')}`;
}
function diffSummary(before, after) {
  const labels = {
    problem: "Problem", decision: "Decision", rationale: "Rationale", status: "Status",
    impact: "Impact", approver: "Approver", approverRole: "Approver role", date: "Date", reviewBy: "Revisit date",
  };
  const out = [];
  Object.keys(labels).forEach(k => {
    const a = before[k] || "", b = after[k] || "";
    if (a !== b) out.push(labels[k] + ": “" + (a || "empty") + "” → “" + (b || "empty") + "”");
  });
  if (JSON.stringify(before.options || []) !== JSON.stringify(after.options || [])) out.push("Options considered were updated");
  if ((before.tags || []).join() !== (after.tags || []).join()) out.push("Tags were updated");
  return out;
}

   17. ACTIONS
   ========================================================================= */
function byId(list, id) { return list.find(x => x.id === id); }
/** Whatever this record calls itself, for dialogs and the activity log. */
function itemLabel(item, fallback) {
  return item.title || item.problem || item.name || item.text || (item.date ? fmtDate(item.date) : "") || fallback;
}
function deleteFrom(domain, id, label) {
  const item = byId(S[domain].items, id);
  if (!item) return;
  confirmDialog({
    title: "Delete this " + label + "?",
    message: "“" + String(itemLabel(item, label)).slice(0, 80) + "” will be removed. This cannot be undone.",
    confirmLabel: "Delete", danger: true,
    onConfirm: () => mutate(domain, () => {
      S[domain].items = S[domain].items.filter(x => x.id !== id);
    }, "Deleted " + label + ": " + String(itemLabel(item, label)).slice(0, 60), "delete"),
  });
}
/**
 * Records when a card started moving and when it finished, which is where the
 * cycle-time and velocity numbers come from. Called from every move path.
 */
function stampMove(task, board, toColumnId) {
  const finished = doneColumn(board);
  const first = board.columns[0];
  task.columnId = toColumnId;
  task.updatedAt = nowISO();
  task.movedAt = nowISO();
  if (first && toColumnId !== first.id && !task.startedAt) task.startedAt = nowISO();
  if (finished && toColumnId === finished.id) {
    if (!task.doneAt) task.doneAt = nowISO();
    if (!task.startedAt) task.startedAt = task.createdAt || nowISO();
    task.blocked = false;
  } else if (task.doneAt) {
    // Dragged back out of Done — it is not finished after all.
    task.doneAt = "";
  }
}
function deleteFootBtn(action, id) {
  return `<button type="button" class="btn btn-danger-soft btn-sm" data-action="${action}" data-id="${id}">${ic("trash", 13)}Delete</button>`;
}

    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";

      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let bundle;
        try { bundle = JSON.parse(String(reader.result)); }
        catch (e) { toast("That file is not valid JSON.", "err", 5000); return; }
        const data = bundle && bundle.data ? bundle.data : bundle;
        if (!data || typeof data !== "object") { toast("Nothing recognisable in that file.", "err"); return; }
        let added = 0, updated = 0;
        DOMAINS.forEach(k => {
          if (!data[k]) return;
          if (k === "settings") { Object.assign(S.settings, data[k]); markDirty("settings"); return; }
          (data[k].items || []).forEach(item => {
            if (!item || !item.id) return;
            const i = S[k].items.findIndex(x => x.id === item.id);
            if (i >= 0) { S[k].items[i] = item; updated++; } else { S[k].items.push(item); added++; }
          });
          markDirty(k);
        });
        applyTheme();
        logActivity("Imported a backup (" + added + " new, " + updated + " updated)", "create");
        render();
        toast("Imported: " + added + " new, " + updated + " updated.", "ok", 4500);

      reader.readAsText(file);

/**
 * Turn editor rows into board columns.
 * Only included, named rows survive, and exactly one column is marked finished.
 * Returns [] when nothing is left — the caller refuses the save rather than
 * silently resurrecting the defaults.
 */
function normaliseColumns(rows, existing, doneColumnId) {
  const out = (rows || []).filter(r => r.include && r.name).map(r => {
    const prev = r.id ? existing.find(c => c.id === r.id) : null;
    return {
      id: (prev && prev.id) || r.id || uid("col"),
      name: r.name,
      accent: r.accent || "slate",
      isDone: false,
      wip: r.wip === undefined || r.wip === "" ? (prev ? prev.wip : undefined) : (Number(r.wip) || undefined),
    };
  });
  if (!out.length) return out;
  const chosen = out.find(c => c.id === doneColumnId) || out[out.length - 1];
  chosen.isDone = true;
  return out;
}

/** The one column that means finished. Tolerates malformed stored data. */
function doneColumn(board) {
  if (!board || !board.columns || !board.columns.length) return null;
  const flagged = board.columns.filter(c => c.isDone);
  return flagged.length ? flagged[flagged.length - 1] : null;
}

async function folderHasData() {
  for (const k of DOMAINS) {
    if (k === "settings") continue;
    const doc = await Store.read(k);
    if (doc && Array.isArray(doc.items) && doc.items.length) return true;
  }
  return false;
}

/** Folder already holds a workspace and the user is switching storage into it. */
function openFolderConflict(current) {
  $("#modalHost").innerHTML =
    `<div class="overlay"><div class="modal">
      <div class="modal-head"><div><h3>That folder already has a workspace</h3>
        <p>${esc(Store.folderName)} contains saved data. Nothing has been written yet — choose what should happen.</p></div></div>
      <div class="modal-body stack">
        <button class="choice" data-action="conflict-load">
          <span class="ic">${ic("folder", 20)}</span>
          <span><h4>Open the folder's workspace</h4><p>Load what is already there and work on it from now on. Recommended — nothing is overwritten.</p></span>
        </button>
        <button class="choice" data-action="conflict-replace">
          <span class="ic" style="background:var(--red-weak);color:var(--red)">${ic("alert", 20)}</span>
          <span><h4>Replace it with what I have open</h4><p>Overwrites the JSON files in that folder with the workspace currently on screen. Cannot be undone.</p></span>
        </button>
        <button class="btn btn-ghost btn-block" data-action="modal-close">Cancel</button>
      </div></div></div>`;
  window.__conflictSnapshot = current;
}
ACTIONS["conflict-load"] = async function () {
  saveConfig({ mode: "folder" });
  await start();
  toast("Opened the workspace from " + Store.folderName + ".", "ok", 4000);
};
ACTIONS["conflict-replace"] = function () {
  confirmDialog({
    title: "Overwrite the files in that folder?",
    message: "The workspace stored in " + Store.folderName + " will be replaced by the one on screen.",
    confirmLabel: "Overwrite", danger: true, requireText: "OVERWRITE",
    onConfirm: async () => {
      S = window.__conflictSnapshot;
      saveConfig({ mode: "folder" });
      S.settings.storageMode = "folder";
      DOMAINS.forEach(markDirty);
      await flush();
      closeAllModals();
      render();
      toast("Folder overwritten with your current workspace.", "ok", 4000);
    },
  });
};

function saveConfig(cfg) {

}

/* ============================================================================
   18. EVENT WIRING
   ========================================================================= */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (el) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) {
      if (el.tagName !== "SELECT" && el.type !== "checkbox") ev.preventDefault();
      ev.stopPropagation();
      fn(el, ev);
      return;
    }
  }
  // click outside an open dropdown closes it
  if (ui.panel && !ev.target.closest(".panel")) { ui.panel = null; renderPanel(); }
  // click on the dark overlay closes the modal
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-overlay")) closeAllModals();
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-action]");
  if (el && (el.tagName === "SELECT")) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el, ev);
  }
});

/* Settings fields save as you type, without re-rendering the input you are in. */
let settingTimer = null;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "search") {
    ui.search = el.value.trim();
    clearTimeout(settingTimer);
    settingTimer = setTimeout(() => render(), 130);
    return;
  }
  if (!el.dataset || !el.dataset.setting) return;
  const path = el.dataset.setting.split(".");
  let target = S.settings;
  while (path.length > 1) target = target[path.shift()];
  target[path[0]] = el.value;
  markDirty("settings");
  renderTopbar();
  renderFocusCard();
});

const SHORTCUTS = [
  ["/", "Jump to the search box"],
  ["n", "New task on the current board"],
  ["s", "New snippet"],
  ["c", "New command"],
  ["d", "Record a decision"],
  ["f", "Start a focus session"],
  ["b", "Go to Boards"],
  ["g", "Go to Overview"],
  ["?", "Show this list"],
  ["Esc", "Close a dialog or panel"],
];

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {
    if ($("#modalHost").innerHTML && !$("#modalHost .wizard")) { closeAllModals(); return; }
    if (ui.panel) { ui.panel = null; renderPanel(); }
    return;
  }
  // Never steal a keystroke from something the user is typing into.
  const el = ev.target;
  const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey || !ui.ready) return;
  if ($("#modalHost").innerHTML) return;

  const go = view => { ui.view = view; ui.panel = null; ui.keepScroll = false; location.hash = "#/" + view; render(); };
  switch (ev.key) {
    case "/": ev.preventDefault(); { const s = $("#search"); if (s) s.focus(); } break;
    case "n": ev.preventDefault(); ACTIONS["new-task"](); break;
    case "s": ev.preventDefault(); ACTIONS["new-snippet"](); break;
    case "c": ev.preventDefault(); ACTIONS["new-command"](); break;
    case "d": ev.preventDefault(); ACTIONS["new-decision"](); break;
    case "f": ev.preventDefault(); ACTIONS["focus-start"](); break;
    case "b": ev.preventDefault(); go("taskboard"); break;
    case "g": ev.preventDefault(); go("overview"); break;
    case "?": ev.preventDefault(); ACTIONS["show-shortcuts"](); break;
    default: break;
  }
});

/* ---------------------------------------------------------- drag and drop */
let dragTaskId = null;
let dragBacklogId = null;

document.addEventListener("dragstart", ev => {
  const task = ev.target.closest && ev.target.closest(".task");
  if (task) {
    dragTaskId = task.dataset.taskId;
    task.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragTaskId);
    return;
  }
  const row = ev.target.closest && ev.target.closest("[data-backlog-id]");
  if (row) {
    dragBacklogId = row.dataset.backlogId;
    row.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragBacklogId);
  }
});
document.addEventListener("dragend", () => {
  dragTaskId = null; dragBacklogId = null;
  $$(".dragging").forEach(e => e.classList.remove("dragging"));
  $$(".drop-on").forEach(e => e.classList.remove("drop-on"));
  $$(".drag-target").forEach(e => e.classList.remove("drag-target"));
});
document.addEventListener("dragover", ev => {
  if (dragTaskId) {
    // The whole column is the drop zone, header and "Add Task" strip included.
    const col = ev.target.closest("[data-drop-col]");
    if (!col) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    $$(".drop-on").forEach(e => e.classList.remove("drop-on"));
    col.classList.add("drop-on");
    return;
  }
  if (dragBacklogId) {
    const row = ev.target.closest("[data-backlog-id]");
    if (!row || row.dataset.backlogId === dragBacklogId) return;
    ev.preventDefault();
    $$(".drag-target").forEach(e => e.classList.remove("drag-target"));
    row.classList.add("drag-target");
  }
});
document.addEventListener("drop", ev => {
  if (dragTaskId) {
    const col = ev.target.closest("[data-drop-col]");
    if (!col) return;
    ev.preventDefault();
    const board = activeBoard();
    const colId = col.dataset.dropCol;
    const idx = board.tasks.findIndex(t => t.id === dragTaskId);
    if (idx < 0) return;
    const moved = board.tasks[idx];
    const from = board.columns.find(c => c.id === moved.columnId);
    const to = board.columns.find(c => c.id === colId);
    const beforeEl = insertBefore($(".kbody", col) || col, ev.clientY);
    const changedColumn = moved.columnId !== colId;
    const over = to && to.wip && board.tasks.filter(x => x.columnId === colId && x.id !== moved.id).length >= to.wip;
    mutate("boards", () => {
      board.tasks.splice(idx, 1);
      if (changedColumn) stampMove(moved, board, colId);
      else { moved.columnId = colId; moved.updatedAt = nowISO(); }
      const at = beforeEl ? board.tasks.findIndex(t => t.id === beforeEl.dataset.taskId) : -1;
      if (at >= 0) board.tasks.splice(at, 0, moved); else board.tasks.push(moved);
    }, from && to && from.id !== to.id ? "Moved “" + moved.title + "” from " + from.name + " to " + to.name : null, "move");
    if (changedColumn && over) toast(to.name + " is over its WIP limit of " + to.wip + ".", "warn", 5000);
    dragTaskId = null;
    return;
  }
  if (dragBacklogId) {
    const row = ev.target.closest("[data-backlog-id]");
    if (!row) return;
    ev.preventDefault();
    const list = sortBy(S.refinement.items, b => b.order === undefined ? 9999 : b.order);
    const from = list.findIndex(b => b.id === dragBacklogId);
    let to = list.findIndex(b => b.id === row.dataset.backlogId);
    if (from < 0 || to < 0 || from === to) return;
    mutate("refinement", () => {
      const [item] = list.splice(from, 1);
      list.splice(to, 0, item);
      list.forEach((b, i) => { b.order = i; });
      S.refinement.items = list;
    });
    dragBacklogId = null;
  }
});
/** The card the dragged one should be inserted before, based on pointer Y. */
function insertBefore(container, y) {
  const cards = $$(".task:not(.dragging)", container);
  let best = null, bestOffset = Number.NEGATIVE_INFINITY;
  cards.forEach(card => {
    const box = card.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = card; }
  });
  return best;
}

window.addEventListener("hashchange", () => {
  const v = location.hash.replace("#/", "");
  if (VIEWS[v] && v !== ui.view) { ui.view = v; ui.keepScroll = false; render(); }
});
window.addEventListener("beforeunload", ev => {
  if (!dirty.size) return;
  if (Store.mode === "local") {
    // localStorage is synchronous, so a pending save can still land on the way out.
    dirty.forEach(k => { try { Store.write(k, S[k]); } catch (e) { /* nothing else to try */ } });
    dirty.clear();
    return;
  }
  // Writing to disk is async and cannot finish here — let the user decide.
  ev.preventDefault();
  ev.returnValue = "";
});

/* ============================================================================
   19. BOOT
   ========================================================================= */
async function start() {
  await loadAll();
  ui.ready = true;
  closeAllModals();
  const v = location.hash.replace("#/", "");
  if (VIEWS[v]) ui.view = v;
  render();
  renderTimer();
}

async function boot() {
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); } catch (e) { /* ignore */ }

  if (!cfg) { openWizard(); return; }

  if (cfg.mode === "folder") {
    let handle = null;
    try { handle = await idbGet("dir"); } catch (e) { /* ignore */ }
    if (!handle) {
      toast("This browser could not remember your folder — please pick it again.", "warn", 6000);
      openWizard();
      return;
    }
    const perm = handle.queryPermission ? await handle.queryPermission({ mode: "readwrite" }) : "granted";
    if (perm !== "granted") { openReconnect(handle); return; }
    Store.mode = "folder";
    Store.dir = handle;
    Store.folderName = handle.name;
  } else {
    Store.mode = "local";
  }
  await start();
}

boot();
